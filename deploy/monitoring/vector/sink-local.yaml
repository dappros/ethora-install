#
# Vector sink of the `local` monitoring mode: the VictoriaLogs container of this
# host (compose service `victorialogs`). Loaded together with vector.yaml.

sinks:
  logs:
    type: elasticsearch
    inputs: [docker_labels, pm2_labels]
    endpoints:
      - http://victorialogs:9428/insert/elasticsearch/
    mode: bulk
    api_version: v8
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: source,service,stream,level
    compression: gzip
    batch:
      timeout_secs: 2
    buffer:
      type: disk
      # 256 MiB plus a 32-byte header: the smallest disk buffer Vector accepts.
      max_size: 268435488
      when_full: block
