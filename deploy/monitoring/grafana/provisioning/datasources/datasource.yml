apiVersion: 1

datasources:
  - name: Prometheus
    uid: ethora-prom
    type: prometheus
    access: proxy
    # Prometheus runs with --web.route-prefix=/prometheus/, so its API lives
    # under /prometheus/ too — the datasource URL must include that prefix or
    # every query 404s ("No data").
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: true

  # Logs (VictoriaLogs, via the victoriametrics-logs-datasource plugin that the
  # compose file installs). The containers behind it run only when
  # services.monitoring.logs.enabled is true; with logs off the datasource is
  # still listed and simply has nothing to answer with. The uid is what the
  # "Logs" link in alert e-mails and the Ethora Logs dashboard point at.
  - name: VictoriaLogs
    uid: ethora-logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victorialogs:9428
    editable: true
    jsonData:
      maxLines: 1000
