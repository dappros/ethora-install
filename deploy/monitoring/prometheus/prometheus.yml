#
# Prometheus of the `local` monitoring mode: scrapes this host and keeps the
# data here (15 days, see docker-compose.monitoring.yml), Grafana on the same
# host reads it. The scrape jobs live in scrape.yml, shared with the agent of
# the `remote` mode.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_config_files:
  - /etc/prometheus/scrape.yml
