; Ethora Core processes (start.sh renders their config into /run/ethora/config
; first). Each one is a container of the compose bundle there, run with the
; same script here; all run as the cloudron user and log to the app log.

[program:minio]
command=/usr/local/bin/minio server /app/data/minio --address 127.0.0.1:9000 --console-address 127.0.0.1:9001
environment=HOME="/app/data/minio",MINIO_ROOT_USER_FILE="/run/ethora/config/minio/root-user",MINIO_ROOT_PASSWORD_FILE="/run/ethora/config/minio/root-password",MINIO_BROWSER="off"
user=cloudron
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:centrifugo]
command=/usr/local/bin/centrifugo -c /run/ethora/config/centrifugo/config.json
environment=HOME="/run/ethora"
directory=/run/ethora
user=cloudron
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xmpp]
command=/bin/sh /ethora/scripts/xmpp-start.sh
; +Q: the Erlang VM sizes its port table from the open-files limit.
environment=HOME="/opt/ejabberd",ETHORA_XMPP_CONFIG_DIR="/run/ethora/config/xmpp",ERL_FLAGS="+Q 65536"
directory=/opt/ejabberd
user=cloudron
priority=20
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/bin/bash /ethora/scripts/api-entrypoint.sh api
environment=HOME="/tmp",ETHORA_BACKEND_ENV_FILE="/run/ethora/config/api/backend.env"
directory=/app
user=cloudron
priority=30
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:jobs]
command=/bin/bash /ethora/scripts/api-entrypoint.sh jobs
environment=HOME="/tmp",ETHORA_BACKEND_ENV_FILE="/run/ethora/config/api/backend.env"
directory=/app
user=cloudron
priority=30
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; First-boot steps, idempotent, on every start once the API answers: base
; app and admin, the base app's ejabberd accounts, data migrations.
[program:init]
command=/bin/bash -c 'for i in $(seq 1 150); do curl -fsS -o /dev/null http://127.0.0.1:8080/v1/ping && exec /bin/bash /ethora/scripts/api-entrypoint.sh init; sleep 2; done; echo "[init] the API did not answer within 5 minutes" >&2; exit 1'
environment=HOME="/tmp",ETHORA_BACKEND_ENV_FILE="/run/ethora/config/api/backend.env"
directory=/app
user=cloudron
priority=40
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=/usr/local/bin/caddy run --config /run/ethora/config/caddy/Caddyfile --adapter caddyfile
environment=HOME="/run/ethora",XDG_DATA_HOME="/run/ethora/caddy/data",XDG_CONFIG_HOME="/run/ethora/caddy/config"
user=cloudron
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
