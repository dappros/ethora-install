{{- $root := . -}}
{{- /* ------------------------------------------------------------ mongo */ -}}
{{- if .Values.mongo.enabled }}
{{- $c := dict "root" . "component" "mongo" }}
# Headless: the replica set's member is <release>-mongo-0.<this service>,
# which must resolve to the pod itself (through a cluster IP, a restarted
# mongod would not recognise itself as the member and the set would have no
# PRIMARY).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ethora.cname" $c }}
  labels: {{- include "ethora.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {{- include "ethora.selectorLabels" $c | nindent 4 }}
  ports:
    - { name: mongo, port: 27017, targetPort: 27017 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ethora.cname" $c }}
  labels: {{- include "ethora.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ethora.cname" $c }}
  replicas: 1
  selector:
    matchLabels: {{- include "ethora.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ethora.selectorLabels" $c | nindent 8 }}
    spec:
      {{- include "ethora.podCommon" . | nindent 6 }}
      containers:
        - name: mongo
          image: {{ include "ethora.image" (dict "root" . "name" "mongo") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # A single-node replica set (rs0), as the API needs; the api pod's
          # mongo-init step initiates it.
          args: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
          ports:
            - { name: mongo, containerPort: 27017 }
          readinessProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.mongo.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data/db }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.mongo.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.persistence.size }}
---
{{- end }}
{{- /* ------------------------------------------------------------ mysql */ -}}
{{- if .Values.mysql.enabled }}
{{- $c := dict "root" . "component" "mysql" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ethora.cname" $c }}
  labels: {{- include "ethora.labels" . | nindent 4 }}
spec:
  selector: {{- include "ethora.selectorLabels" $c | nindent 4 }}
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ethora.cname" $c }}
  labels: {{- include "ethora.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ethora.cname" $c }}
  replicas: 1
  selector:
    matchLabels: {{- include "ethora.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ethora.selectorLabels" $c | nindent 8 }}
    spec:
      {{- include "ethora.podCommon" . | nindent 6 }}
      initContainers:
        {{- include "ethora.renderInit" (dict "root" . "initdb" true) | nindent 8 }}
      containers:
        - name: mysql
          image: {{ include "ethora.image" (dict "root" . "name" "mysql") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["--default-authentication-plugin=mysql_native_password"]
          env:
            - { name: MYSQL_ROOT_PASSWORD_FILE, value: /ethora/config/mysql/root-password }
            # ejabberd connects as root from its own pod (as on a host install).
            - { name: MYSQL_ROOT_HOST, value: "%" }
          ports:
            - { name: mysql, containerPort: 3306 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$(cat /ethora/config/mysql/root-password)\" --silent"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$(cat /ethora/config/mysql/root-password)\" --silent"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          resources: {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            # subPath: a fresh cloud volume carries lost+found, which MySQL
            # refuses to initialise over.
            - { name: data, mountPath: /var/lib/mysql, subPath: mysql }
            - { name: mysql-initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            {{- include "ethora.configMount" . | nindent 12 }}
      volumes:
        {{- include "ethora.configVolume" . | nindent 8 }}
        - name: mysql-initdb
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.mysql.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mysql.persistence.size }}
---
{{- end }}
{{- /* ------------------------------------------------------------ redis */ -}}
{{- if .Values.redis.enabled }}
{{- $c := dict "root" . "component" "redis" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ethora.cname" $c }}
  labels: {{- include "ethora.labels" . | nindent 4 }}
spec:
  selector: {{- include "ethora.selectorLabels" $c | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ethora.cname" $c }}
  labels: {{- include "ethora.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ethora.cname" $c }}
  replicas: 1
  selector:
    matchLabels: {{- include "ethora.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ethora.selectorLabels" $c | nindent 8 }}
    spec:
      {{- include "ethora.podCommon" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ include "ethora.image" (dict "root" . "name" "redis") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
---
{{- end }}
{{- /* ------------------------------------------------------------ minio */ -}}
{{- if .Values.minio.enabled }}
{{- $c := dict "root" . "component" "minio" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ethora.cname" $c }}
  labels: {{- include "ethora.labels" . | nindent 4 }}
spec:
  selector: {{- include "ethora.selectorLabels" $c | nindent 4 }}
  ports:
    - { name: s3, port: 9000, targetPort: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ethora.cname" $c }}
  labels: {{- include "ethora.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "ethora.cname" $c }}
  replicas: 1
  selector:
    matchLabels: {{- include "ethora.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ethora.selectorLabels" $c | nindent 8 }}
    spec:
      {{- include "ethora.podCommon" . | nindent 6 }}
      initContainers:
        {{- include "ethora.renderInit" (dict "root" .) | nindent 8 }}
      containers:
        - name: minio
          # Our unmodified copy of MinIO (AGPL-3.0); MinIO withdrew its public images.
          image: {{ include "ethora.image" (dict "root" . "name" "minio") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["server", "/data"]
          env:
            - { name: MINIO_ROOT_USER_FILE, value: /ethora/config/minio/root-user }
            - { name: MINIO_ROOT_PASSWORD_FILE, value: /ethora/config/minio/root-password }
          ports:
            - { name: s3, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            # subPath: keep the volume's lost+found out of the bucket list.
            - { name: data, mountPath: /data, subPath: minio }
            {{- include "ethora.configMount" . | nindent 12 }}
      volumes:
        {{- include "ethora.configVolume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.minio.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
{{- end }}
