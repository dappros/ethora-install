{{- if not .Values.secrets.existingSecret -}}
{{- $name := include "ethora.secretName" . -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict -}}
{{- $s := .Values.secrets -}}
{{- /* key: [value from values, generated length, generated prefix] */ -}}
{{- $spec := dict
  "ADMIN_PASSWORD" (list .Values.admin.password 20 "")
  "JWT_SECRET" (list $s.jwtSecret 64 "")
  "REFRESH_SECRET" (list $s.refreshSecret 64 "")
  "XMPP_SECRET" (list $s.xmppSecret 32 "")
  "XMPP_JWT_SECRET" (list $s.xmppJwtSecret 64 "")
  "XMPP_ADMIN_PASSWORD" (list $s.xmppAdminPassword 24 "")
  "INTERNAL_REQUESTS_SECRET" (list $s.internalRequestsSecret 32 "")
  "MYSQL_ROOT_PASSWORD" (list $s.mysqlRootPassword 32 "")
  "MINIO_ROOT_USER" (list $s.minioRootUser 12 "ethora-")
  "MINIO_ROOT_PASSWORD" (list $s.minioRootPassword 32 "")
  "CENTRIFUGO_API_KEY" (list $s.centrifugoApiKey 64 "")
  "CENTRIFUGO_HMAC_SECRET" (list $s.centrifugoHmacSecret 64 "")
  "CENTRIFUGO_ADMIN_PASSWORD" (list $s.centrifugoAdminPassword 24 "")
  "CENTRIFUGO_ADMIN_SECRET" (list $s.centrifugoAdminSecret 64 "")
-}}
# Every secret of the install. A value from values.yaml wins; otherwise the
# one already in the cluster is kept, and on the first install one is
# generated. Kept after `helm uninstall` (the PVCs are too, and the databases
# were initialised with these).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "ethora.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $v := $spec }}
  {{- $given := index $v 0 }}
  {{- if $given }}
  {{ $key }}: {{ $given | b64enc | quote }}
  {{- else if hasKey $old $key }}
  {{ $key }}: {{ index $old $key | quote }}
  {{- else }}
  {{ $key }}: {{ printf "%s%s" (index $v 2) (randAlphaNum (index $v 1)) | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
