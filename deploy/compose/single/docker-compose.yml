# Ethora Core in one file. GENERATED from deploy/compose/docker-compose.yml by
# deploy/compose/single/build.sh; edit those, not this.
#
# Save this file as docker-compose.yml in an empty directory, next to a .env
# with at least:
#   ROOT_DOMAIN=chat.example.com     # api./app./xmpp./files. point at this host
#   ADMIN_EMAIL=you@example.com
# (or PUBLIC_URL=https://chat.example.com for everything on one address), then
#   docker compose up -d
# Every other setting of the bundle's .env.example may be added; secrets left
# out are generated on the first start and kept in the `secrets` volume, and
# the admin password is printed once by `docker compose logs config`.
# Platforms that take variables instead of a .env file pass the same names.
#
# Caddy always runs here (ports 80 and 443, Let's Encrypt); behind a proxy of
# your own, start with `docker compose up -d --scale caddy=0` and route the
# hosts as the guide below describes.
#
# The configuration is rendered by the ethora-compose-init image (the xmpp
# image plus the bundle's scripts and templates), which also hands every
# other service its start script through the `config` volume.
# Guide: https://github.com/dappros/ethora-install/tree/main/deploy/compose

name: ethora

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-api: &api
  image: ${ETHORA_API_IMAGE:-docker.io/dappros/ethora-api:2610}
  entrypoint: ["tini", "--", "bash", "/ethora/config/scripts/api-entrypoint.sh"]
  volumes:
    - config:/ethora/config:ro
  <<: *logging

services:
  # ---------------------------------------------------------------- config --
  config:
    image: ${ETHORA_COMPOSE_INIT_IMAGE:-docker.io/dappros/ethora-compose-init:2610}
    user: "0:0"
    entrypoint: ["/bin/sh", "/ethora/scripts/render-config.sh"]
    # Every value in .env reaches the renderer, so any variable of the
    # installer's templates (POSTMARK_*, EMAIL_TLD_*, RATE_LIMIT_*, ...) can
    # be set there. The settings of .env.example are also listed here, for
    # platforms that pass variables without writing a .env file. Only
    # ROOT_DOMAIN (or PUBLIC_URL) and ADMIN_EMAIL are required: empty
    # secrets are generated into the secrets volume.
    env_file:
      - path: .env
        required: false
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      API_DOMAIN: ${API_DOMAIN:-}
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      XMPP_DOMAIN: ${XMPP_DOMAIN:-}
      FILES_DOMAIN: ${FILES_DOMAIN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BASE_APP_DISPLAY_NAME: ${BASE_APP_DISPLAY_NAME:-Ethora}
      ETHORA_LICENSE_KEY: ${ETHORA_LICENSE_KEY:-}
      ETHORA_LICENSE_CALL_HOME: ${ETHORA_LICENSE_CALL_HOME:-true}
      ETHORA_LICENSE_SERVER_URL: ${ETHORA_LICENSE_SERVER_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      REFRESH_SECRET: ${REFRESH_SECRET:-}
      XMPP_SECRET: ${XMPP_SECRET:-}
      XMPP_JWT_SECRET: ${XMPP_JWT_SECRET:-}
      CRYPTOPAIR_SECRET: ${CRYPTOPAIR_SECRET:-}
      SECRET_FOR_DB_ENCRYPTION: ${SECRET_FOR_DB_ENCRYPTION:-}
      SECRET_FOR_FILES_ENCRYPTION: ${SECRET_FOR_FILES_ENCRYPTION:-}
      XMPP_ADMIN_PASSWORD: ${XMPP_ADMIN_PASSWORD:-}
      INTERNAL_REQUESTS_SECRET: ${INTERNAL_REQUESTS_SECRET:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-}
      CENTRIFUGO_HMAC_SECRET: ${CENTRIFUGO_HMAC_SECRET:-}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    volumes:
      - config:/out/config
      - mysql-initdb:/out/mysql-initdb
      - secrets:/out/secrets
    restart: "no"
    <<: *logging

  # ------------------------------------------------------------- databases --
  mongo:
    image: mongo:6.0.8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo:/data/db
      - mongo-config:/data/configdb
    restart: unless-stopped
    healthcheck:
      # A TCP connect, not mongosh: see docker-compose.enterprise.yml.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 10s
      timeout: 5s
      retries: 30
    <<: *logging

  mongo-init:
    image: mongo:6.0.8
    entrypoint: ["bash", "/ethora/config/scripts/mongo-init.sh"]
    volumes:
      - config:/ethora/config:ro
    depends_on:
      config:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    restart: "no"
    <<: *logging

  mysql:
    image: mysql:8.1.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /ethora/config/mysql/root-password
      # ejabberd connects as root from its own container (as on a host install).
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql:/var/lib/mysql
      - mysql-initdb:/docker-entrypoint-initdb.d:ro
      - config:/ethora/config:ro
    depends_on:
      config:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /ethora/config/mysql/root-password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    <<: *logging

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *logging

  minio:
    # Our unmodified copy of the MinIO release every install runs (AGPL-3.0);
    # MinIO withdrew its public images. Set MINIO_IMAGE for a private mirror.
    image: ${MINIO_IMAGE:-docker.io/dappros/minio:RELEASE.2025-09-07T16-13-09Z}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /ethora/config/minio/root-user
      MINIO_ROOT_PASSWORD_FILE: /ethora/config/minio/root-password
    volumes:
      - minio:/data
      - config:/ethora/config:ro
    depends_on:
      config:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    <<: *logging

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: ["centrifugo", "-c", "/ethora/config/centrifugo/config.json"]
    volumes:
      - config:/ethora/config:ro
    depends_on:
      config:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *logging

  # ------------------------------------------------------------------ xmpp --
  xmpp:
    image: ${ETHORA_XMPP_IMAGE:-docker.io/dappros/ethora-xmpp:2610}
    # The xmpp host and admin password come from the rendered config.
    entrypoint: ["/bin/sh", "/ethora/config/scripts/xmpp-start.sh"]
    volumes:
      - config:/ethora/config:ro
    # Native XMPP clients (port 5222) are not exposed by default; web and SDK
    # clients connect over wss://xmpp.<root>/ws through caddy. See README.md.
    depends_on:
      config:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Healthy once ejabberd runs AND the admin account is ensured, which is
      # what the API and init need.
      test: ["CMD-SHELL", "test -f /tmp/ethora-admin-ready && /opt/ejabberd/bin/ejabberdctl status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    <<: *logging

  # ------------------------------------------------------------------- api --
  api:
    <<: *api
    command: ["api"]
    depends_on:
      config:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      xmpp:
        condition: service_started
    restart: unless-stopped
    # The image's own check (GET /v1/ping), spelled out for tools that read
    # only the compose file.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  jobs:
    <<: *api
    command: ["jobs"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  init:
    <<: *api
    command: ["init"]
    depends_on:
      api:
        condition: service_healthy
      xmpp:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  # End-to-end check through the public URLs (scripts/verify.js):
  #   docker compose --profile verify run --rm verify
  verify:
    <<: *api
    profiles: ["verify"]
    command: ["verify"]
    restart: "no"
    healthcheck:
      disable: true

  # -------------------------------------------------------------- frontend --
  frontend:
    image: ${ETHORA_FRONTEND_IMAGE:-docker.io/dappros/ethora-frontend:2610}
    entrypoint: ["/bin/sh", "/ethora/config/scripts/frontend-start.sh"]
    command: ["serve"]
    volumes:
      - config:/ethora/config:ro
    depends_on:
      config:
        condition: service_completed_successfully
    restart: unless-stopped
    <<: *logging

  # ----------------------------------------------------------------- caddy --
  caddy:
    image: caddy:2.10-alpine
    # The Caddyfile is rendered by the config service (hosts or one origin).
    command: ["caddy", "run", "--config", "/ethora/config/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - config:/ethora/config:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      config:
        condition: service_completed_successfully
      api:
        condition: service_started
      frontend:
        condition: service_started
      xmpp:
        condition: service_started
      minio:
        condition: service_started
      centrifugo:
        condition: service_started
    restart: unless-stopped
    <<: *logging

volumes:
  # Your data. Survive `docker compose down`; `down -v` deletes them.
  mongo:
  mysql:
  minio:
  redis:
  caddy-data:      # certificates and ACME account
  secrets:         # secrets generated for values left out of .env
  # Regenerated on every start; safe to delete.
  mongo-config:
  config:
  mysql-initdb:
  caddy-config:
