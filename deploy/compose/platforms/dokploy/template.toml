cfg="$stage/xmpp/ejabberd.yml"
cp "$DIST/ejabberd-prod.yml" "$cfg"
export TRACK_MEMBER_URL="${TRACK_MEMBER_URL:-$ETHORA_API_URL/v1/chats/track-member}"
export TRACK_LAST_MESSAGE_URL="${TRACK_LAST_MESSAGE_URL:-$ETHORA_API_URL/v1/chats/track-last-message}"
export TRACK_MESSAGE_URL="${TRACK_MESSAGE_URL:-$ETHORA_API_URL/v1/chats/archive-message}"
export HISTORY_ACCESS_URL="${HISTORY_ACCESS_URL:-$ETHORA_API_URL/v1/chats/history-access}"
export MESSAGE_AUDIT_URL="${MESSAGE_AUDIT_URL:-$ETHORA_API_URL/v1/chats/message-audit}"
# ejabberd's offline pushes: the push service itself with the push module,
# else the public URL the host installer uses (answers 404 without the module).
if [ "$PUSH_MODULE" = true ]; then PUSH_COMMON_POST_URL="${PUSH_COMMON_POST_URL:-$ETHORA_PUSH_URL/api/v2/push}"
else PUSH_COMMON_POST_URL="${PUSH_COMMON_POST_URL:-https://$API_DOMAIN/push/api/v2/push}"; fi
PUSH_VOIP_POST_URL="${PUSH_VOIP_POST_URL:-http://host.docker.internal:7778/api/v1/voippush}"
push_token="${B2B_PUSH_SECRET:-$INTERNAL_REQUESTS_SECRET}"
admin_jid="admin@$XMPP_DOMAIN"

# Values go into sed replacement text below: escape \, | (the delimiter) and
# & so an operator-chosen password with those characters renders literally.
esc() { printf '%s' "$1" | sed -e 's/[\\|&]/\\&/g'; }
E_XMPP_DOMAIN="$(esc "$XMPP_DOMAIN")"
E_ADMIN_JID="$(esc "$admin_jid")"
E_MYSQL_ROOT_PASSWORD="$(esc "$MYSQL_ROOT_PASSWORD")"
E_XMPP_SECRET="$(esc "$XMPP_SECRET")"
E_TRACK_MEMBER_URL="$(esc "$TRACK_MEMBER_URL")"
E_TRACK_LAST_MESSAGE_URL="$(esc "$TRACK_LAST_MESSAGE_URL")"
E_TRACK_MESSAGE_URL="$(esc "$TRACK_MESSAGE_URL")"
E_HISTORY_ACCESS_URL="$(esc "$HISTORY_ACCESS_URL")"
E_MESSAGE_AUDIT_URL="$(esc "$MESSAGE_AUDIT_URL")"
E_PUSH_COMMON_POST_URL="$(esc "$PUSH_COMMON_POST_URL")"
E_PUSH_VOIP_POST_URL="$(esc "$PUSH_VOIP_POST_URL")"
E_PUSH_TOKEN="$(esc "$push_token")"
E_TRANSLATE_URL="$(esc "${TRANSLATE_URL:-}")"

# hosts
sed -i "/^hosts:/,/^[a-z]/s|^  -.*|  - $E_XMPP_DOMAIN|" "$cfg"
# acl admin / apicommands
sed -i \
  -e "/^  admin:/,/^  [a-z]/ s|^[ ]*- \"[^\"]*\"|      - \"$E_ADMIN_JID\"|g" \
  -e "/^  apicommands:/,/^  [a-z]/ s|^[ ]*- \"[^\"]*\"|      - \"$E_ADMIN_JID\"|g" \
  "$cfg"
# sql password
sed -i "s|^sql_password:.*|sql_password: \"$E_MYSQL_ROOT_PASSWORD\"|g" "$cfg"
# sql server, user, port: only when they differ from the template's
# (mysql, root, 3306), so the default rendering stays the installer's.
if [ "$ETHORA_MYSQL_HOST" != mysql ]; then
  sed -i "s|^sql_server:.*|sql_server: \"$(esc "$ETHORA_MYSQL_HOST")\"|" "$cfg"
fi
if [ "$ETHORA_MYSQL_DATABASE" != ejabberd_db ]; then
  sed -i "s|^sql_database:.*|sql_database: \"$(esc "$ETHORA_MYSQL_DATABASE")\"|" "$cfg"
fi
if [ "$ETHORA_MYSQL_USER" != root ]; then
  sed -i "s|^sql_username:.*|sql_username: \"$(esc "$ETHORA_MYSQL_USER")\"|" "$cfg"
fi
if [ "$MYSQL_PORT" != 3306 ]; then
  if grep -q '^sql_port:' "$cfg"; then sed -i "s|^sql_port:.*|sql_port: $MYSQL_PORT|" "$cfg"
  else awk -v p="$MYSQL_PORT" '{ print } /^sql_server:/ { print "sql_port: " p }' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"; fi
fi
# tracking modules
sed -i \
  -e "/^  mod_track_member:/,/^  [a-z_]/ s|^[ ]*url:.*|    url: \"$E_TRACK_MEMBER_URL\"|g" \
  -e "/^  mod_track_member:/,/^  [a-z_]/ s|^[ ]*secret:.*|    secret: \"$E_XMPP_SECRET\"|g" \
  -e "/^  mod_track_last_message:/,/^  [a-z_]/ s|^[ ]*url:.*|    url: \"$E_TRACK_LAST_MESSAGE_URL\"|g" \
  -e "/^  mod_track_last_message:/,/^  [a-z_]/ s|^[ ]*secret:.*|    secret: \"$E_XMPP_SECRET\"|g" \
  "$cfg"
if grep -q "^  mod_track_message:" "$cfg"; then
  sed -i \
    -e "/^  mod_track_message:/,/^  [a-z_]/ s|^[ ]*url:.*|    url: \"$E_TRACK_MESSAGE_URL\"|g" \
    -e "/^  mod_track_message:/,/^  [a-z_]/ s|^[ ]*secret:.*|    secret: \"$E_XMPP_SECRET\"|g" \
    "$cfg"
fi
if grep -q "^  mod_history_access:" "$cfg"; then
  sed -i \
    -e "/^  mod_history_access:/,/^  [a-z_]/ s|^[ ]*url:.*|    url: \"$E_HISTORY_ACCESS_URL\"|g" \
    -e "/^  mod_history_access:/,/^  [a-z_]/ s|^[ ]*secret:.*|    secret: \"$E_XMPP_SECRET\"|g" \
    "$cfg"
fi
# mod_edit / mod_delete ship as bare `{}` blocks: expand them into url/secret
# lines first (awk, so BusyBox and GNU produce the same text), then render.
for audit_mod in mod_edit mod_delete; do
  if grep -qE "^  $audit_mod:[[:space:]]*\{\}[[:space:]]*$" "$cfg"; then
    awk -v m="$audit_mod" '
      $0 ~ "^  " m ":[[:space:]]*\\{\\}[[:space:]]*$" { print "  " m ":"; print "    url: \"\""; print "    secret: \"\""; next }
      { print }' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
  fi
  if grep -q "^  $audit_mod:" "$cfg"; then
    sed -i \
      -e "/^  $audit_mod:/,/^  [a-z_]/ s|^[ ]*url:.*|    url: \"$E_MESSAGE_AUDIT_URL\"|g" \
      -e "/^  $audit_mod:/,/^  [a-z_]/ s|^[ ]*secret:.*|    secret: \"$E_XMPP_SECRET\"|g" \
      "$cfg"
  fi
done
# mod_offline_post
sed -i \
  -e "/^  mod_offline_post:/,/^  [a-z_]/ s|^[ ]*common_post_url:.*|    common_post_url: \"$E_PUSH_COMMON_POST_URL\"|g" \
  -e "/^  mod_offline_post:/,/^  [a-z_]/ s|^[ ]*voip_post_url:.*|    voip_post_url: \"$E_PUSH_VOIP_POST_URL\"|g" \
  -e "/^  mod_offline_post:/,/^  [a-z_]/ s|^[ ]*auth_token:.*|    auth_token: \"$E_PUSH_TOKEN\"|g" \
  "$cfg"
# certfiles
sed -i "s|/cert/[^\" ]*\\.pem|/cert/$E_XMPP_DOMAIN.pem|g" "$cfg"
# translate_url (only when set)
if [ -n "${TRANSLATE_URL:-}" ]; then
  sed -i "s|^\([[:space:]]*\)translate_url:.*|\1translate_url: \"$E_TRANSLATE_URL\"|" "$cfg"
fi
# JWT SASL auth
k="$(printf '%s' "$XMPP_JWT_SECRET" | base64 | tr -d '\n' | tr '+/' '-_' | tr -d '=')"
printf '{"kty":"oct","k":"%s"}' "$k" > "$stage/xmpp/jwt.key"
sed -i "s|^auth_method:.*|auth_method: [sql, jwt, anonymous]|" "$cfg"
if ! grep -qE "^jwt_key:" "$cfg"; then
  awk '{ print } /^auth_method:/ { print "jwt_key: \"/home/ejabberd/conf/jwt.key\""; print "jwt_jid_field: \"jid\"" }' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
fi

# xmpp-start.sh registers admin@<xmpp host> with this password.
printf '%s\n' "$XMPP_ADMIN_PASSWORD" > "$stage/xmpp/admin-password"

# Database credentials for the images' *_FILE variables.
mkdir -p "$stage/mysql" "$stage/minio"
printf '%s' "$MYSQL_ROOT_PASSWORD" > "$stage/mysql/root-password"
printf '%s' "$MINIO_ROOT_USER" > "$stage/minio/root-user"
printf '%s' "$MINIO_ROOT_PASSWORD" > "$stage/minio/root-password"

# Caddyfile: the template's {$NAME} placeholders (Caddy's own syntax), with
# the site blocks of the routing mode in {$ETHORA_SITES}.
if [ -z "$PUBLIC_URL" ]; then
  ETHORA_SITES="$(printf '%s {\n\timport api\n}\n%s {\n\timport web\n}\n%s {\n\timport xmpp\n}\n%s {\n\timport files\n}' \
    "$API_DOMAIN" "$WEB_DOMAIN" "$XMPP_DOMAIN" "$FILES_DOMAIN")"
  if [ -n "$SECURE_FILES_DOMAIN" ]; then
    ETHORA_SITES="$ETHORA_SITES$(printf '\n%s {\n\timport secure_files\n}' "$SECURE_FILES_DOMAIN")"
  fi
  if [ -n "$WIDGET_DOMAIN" ]; then
    ETHORA_SITES="$ETHORA_SITES$(printf '\n%s {\n\timport widget\n}' "$WIDGET_DOMAIN")"
  fi
  if [ -n "$PLAYGROUND_DOMAIN" ]; then
    ETHORA_SITES="$ETHORA_SITES$(printf '\n%s {\n\timport playground\n}' "$PLAYGROUND_DOMAIN")"
  fi
  if [ -n "$MCP_DOMAIN" ]; then
    ETHORA_SITES="$ETHORA_SITES$(printf '\n%s {\n\timport mcp\n}' "$MCP_DOMAIN")"
  fi
  if [ -n "$UPTIME_DOMAIN" ]; then
    # The bcrypt hash is computed by the caddy service at start from
    # uptime/auth-password and arrives as its environment variable.
    ETHORA_SITES="$ETHORA_SITES$(printf '\n%s {\n\timport security_headers\n\tbasic_auth {\n\t\t%s {$UPTIME_AUTH_HASH}\n\t}\n\treverse_proxy %s\n}' \
      "$UPTIME_DOMAIN" "$UPTIME_AUTH_USER" "$(hostport_of "$ETHORA_UPTIME_URL")")"
  fi
elif [ -n "${ETHORA_SITE_ADDRESS:-}" ]; then
  ETHORA_SITES="$(printf '%s {\n\timport single_origin\n}' "$ETHORA_SITE_ADDRESS")"
elif [ "$scheme" = https ]; then
  ETHORA_SITES="$(printf '%s {\n\timport single_origin\n}' "$hostport")"
else
  # Plain HTTP (a LAN appliance): any host name on the container's port 80,
  # which the platform or HTTP_PORT maps to the port in PUBLIC_URL.
  ETHORA_SITES="$(printf ':80 {\n\timport single_origin\n}')"
fi
export ETHORA_SITES
export ETHORA_EXTRA_SITES="${ETHORA_EXTRA_SITES:-}"
export UPSTREAM_API="$(hostport_of "$ETHORA_API_URL")"
export UPSTREAM_WIDGET="$(hostport_of "$ETHORA_WIDGET_URL")"
export UPSTREAM_PLAYGROUND="$(hostport_of "$ETHORA_PLAYGROUND_URL")"
export UPSTREAM_MCP="$(hostport_of "$ETHORA_MCP_URL")"
# Mobile apps reach the push service at api.<root>/push/ (the one-origin
# install's /push/ too); nothing is routed without the module.
ETHORA_PUSH_ROUTE=""
if [ "$PUSH_MODULE" = true ]; then
  ETHORA_PUSH_ROUTE="$(printf 'handle /push/* {\n\t\turi strip_prefix /push\n\t\treverse_proxy %s\n\t}' "$(hostport_of "$ETHORA_PUSH_URL")")"
fi
export ETHORA_PUSH_ROUTE
# One origin with the ai module: the widget under /widget/ (the upstream is
# written out, Caddy does not substitute inside a substituted value).
ETHORA_WIDGET_ROUTE=""
if [ -n "$PUBLIC_URL" ] && [ "$AI_MODULE" = true ]; then
  ETHORA_WIDGET_ROUTE="$(printf 'handle /widget/* {\n\t\turi strip_prefix /widget\n\t\treverse_proxy %s\n\t}' "$UPSTREAM_WIDGET")"
fi
export ETHORA_WIDGET_ROUTE
export UPSTREAM_XMPP="$(hostport_of "$ETHORA_XMPP_URL")"
export UPSTREAM_CENTRIFUGO="$(hostport_of "$ETHORA_CENTRIFUGO_URL")"
export UPSTREAM_FRONTEND="$(hostport_of "$ETHORA_FRONTEND_URL")"
export UPSTREAM_MINIO="$ETHORA_MINIO_HOST:$MINIO_PORT"
mkdir -p "$stage/caddy"
if [ -f "$CADDYFILE_TEMPLATE" ]; then
  awk '
    /^[[:space:]]*#/ { print; next }
    {
      line = $0; out = ""
      while (match(line, /\{\$[A-Z0-9_]+\}/)) {
        name = substr(line, RSTART + 2, RLENGTH - 3)
        out = out substr(line, 1, RSTART - 1) ((name in ENVIRON) ? ENVIRON[name] : "")
        line = substr(line, RSTART + RLENGTH)
      }
      print out line
    }' "$CADDYFILE_TEMPLATE" > "$stage/caddy/Caddyfile"
else
  log "no Caddyfile template at $CADDYFILE_TEMPLATE; the caddy service will not start"
fi

# The bundle's scripts, for every service that runs one.
mkdir -p "$stage/scripts"
cp "$SCRIPTS_SRC"/*.sh "$SCRIPTS_SRC"/*.js "$stage/scripts/"

# ------------------------------------------------------------ install --
# Hand each directory to the one container user that reads it; secrets stay
# unreadable to the others. Then swap the whole tree in.
chmod 700 "$stage/api" "$stage/frontend" "$stage/centrifugo" "$stage/xmpp" "$stage/mysql" "$stage/minio" "$stage/ai" "$stage/ai-postgres" \
  "$stage/push" "$stage/playground" "$stage/mcp" "$stage/uptime" "$stage/uptime-db"
chmod 600 "$stage"/api/* "$stage"/frontend/* "$stage"/centrifugo/* "$stage"/xmpp/* "$stage"/mysql/* "$stage"/minio/*
for f in "$stage"/ai/* "$stage"/ai-postgres/* "$stage"/push/* "$stage"/playground/* "$stage"/mcp/* "$stage"/uptime/* "$stage"/uptime-db/*; do [ -f "$f" ] && chmod 600 "$f"; done
# Neither secret nor per-service: readable by every container (the widget's
# env names public URLs only).
chmod 755 "$stage/caddy" "$stage/scripts" "$stage/widget"
for f in "$stage"/caddy/* "$stage"/scripts/* "$stage"/widget/*; do [ -f "$f" ] && chmod 644 "$f"; done
# (Only root can hand files over; a non-root run, e.g. the bundle's tests,
# keeps its own ownership.)
own() { chown -R "$1" "$2" 2>/dev/null || [ "$(id -u)" != 0 ] || die "chown $1 $2 failed"; }
own "$API_UID:$API_UID" "$stage/api"
own "$FRONTEND_UID:$FRONTEND_UID" "$stage/frontend"
own "$CENTRIFUGO_UID:$CENTRIFUGO_UID" "$stage/centrifugo"
own "$XMPP_UID:$XMPP_UID" "$stage/xmpp"
own "$MYSQL_UID:$MYSQL_UID" "$stage/mysql"
own "$MINIO_UID:$MINIO_UID" "$stage/minio"
own 0:0 "$stage/caddy"
own 0:0 "$stage/scripts"
own "$AI_UID:$AI_UID" "$stage/ai"
own "$AI_POSTGRES_UID:$AI_POSTGRES_UID" "$stage/ai-postgres"
own 0:0 "$stage/widget"
own "$MODULE_UID:$MODULE_UID" "$stage/push"
own "$MODULE_UID:$MODULE_UID" "$stage/playground"
own "$MODULE_UID:$MODULE_UID" "$stage/mcp"
own 0:0 "$stage/uptime"                    # the uptime image and caddy run as root
own "$UPTIME_POSTGRES_UID:$UPTIME_POSTGRES_UID" "$stage/uptime-db"
mkdir -p "$OUT"
for d in api frontend centrifugo xmpp mysql minio caddy scripts ai ai-postgres widget push playground mcp uptime uptime-db; do
  rm -rf "$OUT/$d.new"
  cp -a "$stage/$d" "$OUT/$d.new"
  rm -rf "$OUT/$d"
  mv "$OUT/$d.new" "$OUT/$d"
done
chmod 755 "$OUT"

# MySQL runs this only when its data directory is empty (first start).
mkdir -p "$MYSQL_INITDB"
cp "$DIST/mysql2.sql" "$MYSQL_INITDB/01-ejabberd.sql"
chmod 644 "$MYSQL_INITDB/01-ejabberd.sql"

if [ -n "$PUBLIC_URL" ]; then
  log "rendered for one origin $PUBLIC_URL (xmpp domain $XMPP_DOMAIN, base app slug $BASE_APP_DOMAIN_NAME)"
else
  log "rendered for $ROOT_DOMAIN: api=$API_DOMAIN web=$WEB_DOMAIN xmpp=$XMPP_DOMAIN files=$FILES_DOMAIN secure-files=${SECURE_FILES_DOMAIN:-off}${WIDGET_DOMAIN:+ widget=$WIDGET_DOMAIN} (base app slug: $BASE_APP_DOMAIN_NAME)"
fi
[ "$AI_MODULE" != true ] || log "ai module on: ai-service, docs-parse, widget ($WIDGET_URL), postgres ${AI_PG_URL#*@}"
[ "$PUSH_MODULE" != true ] || log "push module on: push + push-worker ($ETHORA_PUSH_URL; mobile apps: $api_url/push/)"
[ "$PLAYGROUND_MODULE" != true ] || log "playground module on: $playground_url"
[ "$MCP_MODULE" != true ] || log "mcp module on: $MCP_PUBLIC_URL (OAuth issuer $OAUTH_ISSUER)"
[ "$UPTIME_MODULE" != true ] || log "uptime module on: $uptime_url (user $UPTIME_AUTH_USER), postgres ${UPTIME_DATABASE_URL#*@}"

'''

[[config.mounts]]
filePath = "/scripts/mongo-init.sh"
content = '''
#!/bin/bash
# mongo-init.sh - the `mongo-init` service of the compose bundle.
#
# The API needs MongoDB as a replica set (rs0, one member). Same set-up as
# deploy/docker/mongo_scripts/mongosetup.sh, but idempotent and without the
# fixed 30 s sleep: wait for mongod, initiate only when the set has no
# config yet, then wait until the member is PRIMARY.
set -euo pipefail

HOST="${MONGO_HOST:-mongo:27017}"
mq() { mongosh --host "$HOST" --quiet --eval "$1"; }

for i in $(seq 1 90); do
  [ "$(mq 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null || true)" = "1" ] && break
  [ "$i" = 90 ] && { echo "[mongo-init] mongod at $HOST did not answer within 3 minutes" >&2; exit 1; }
  sleep 2
done

state="$(mq 'try { rs.status().ok } catch (e) { e.codeName }' 2>/dev/null || true)"
if [ "$state" = "1" ]; then
  echo "[mongo-init] replica set rs0 already initiated"
elif [ "$state" = "InvalidReplicaSetConfig" ]; then
  # The set exists but this mongod is not in it: the member's host name no
  # longer resolves to it (a renamed service, an older layout). Keep the set,
  # point its single member at $HOST.
  echo "[mongo-init] replica set rs0 names another host; reconfiguring its member as $HOST"
  mq "const c = rs.conf(); c.members[0].host = '$HOST'; rs.reconfig(c, { force: true }).ok"
else
  echo "[mongo-init] initiating replica set rs0 ($state)"
  # Tolerate a concurrent initiate (two pods starting at once): the loser
  # sees AlreadyInitialized and simply waits for PRIMARY below.
  mq "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '$HOST' }] }).ok } catch (e) { e.codeName }"
fi

for i in $(seq 1 60); do
  [ "$(mq 'db.hello().isWritablePrimary' 2>/dev/null || true)" = "true" ] && { echo "[mongo-init] rs0 PRIMARY"; exit 0; }
  sleep 2
done
echo "[mongo-init] rs0 did not elect a PRIMARY within 2 minutes" >&2
exit 1
'''

[[config.mounts]]
filePath = "/scripts/xmpp-start.sh"
content = '''
#!/bin/sh
# xmpp-start.sh - entrypoint of the xmpp service in the compose bundle.
#
# 1. Installs the ejabberd.yml and jwt.key the config service rendered.
# 2. Starts ejabberd through the image's own entrypoint.
# 3. In the background, once ejabberd answers, makes sure admin@<xmpp host>
#    exists with XMPP_ADMIN_PASSWORD (register, or change_password when it
#    already exists). The host installer does this with `docker exec ...
#    ejabberdctl`; here it runs in the container, where ejabberdctl can reach
#    the node, and it re-runs on every start so a changed password follows.
set -eu

CONF_SRC="${ETHORA_XMPP_CONFIG_DIR:-/ethora/config/xmpp}"
CONF_DIR=/opt/ejabberd/conf
CTL=/opt/ejabberd/bin/ejabberdctl

[ -r "$CONF_SRC/ejabberd.yml" ] || { echo "[xmpp] $CONF_SRC/ejabberd.yml missing; the config service did not run" >&2; exit 1; }
# XMPP_DOMAIN normally arrives from compose (${XMPP_DOMAIN:-xmpp.${ROOT_DOMAIN}}).
# A platform that resolves compose defaults itself (Coolify) hands an empty
# override through as an empty value, so fall back to the host the config
# service rendered into ejabberd.yml.
if [ -z "${XMPP_DOMAIN:-}" ]; then
  XMPP_DOMAIN="$(sed -n '/^hosts:/,/^[a-z]/{s/^  - //p;}' "$CONF_SRC/ejabberd.yml" | head -n 1)"
  export XMPP_DOMAIN
fi
# The password comes from the environment when compose passes it, else from
# the file the config service rendered (it may have generated it).
if [ -z "${XMPP_ADMIN_PASSWORD:-}" ] && [ -r "$CONF_SRC/admin-password" ]; then
  XMPP_ADMIN_PASSWORD="$(cat "$CONF_SRC/admin-password")"
  export XMPP_ADMIN_PASSWORD
fi
cp "$CONF_SRC/ejabberd.yml" "$CONF_DIR/ejabberd.yml"
cp "$CONF_SRC/jwt.key" "$CONF_DIR/jwt.key"
chmod 600 "$CONF_DIR/ejabberd.yml" "$CONF_DIR/jwt.key"

ensure_admin() {
  host="${XMPP_DOMAIN:?}"
  pass="${XMPP_ADMIN_PASSWORD:?}"
  i=0
  until "$CTL" status >/dev/null 2>&1; do
    i=$((i + 1))
    [ "$i" -gt 150 ] && { echo "[xmpp] ejabberd did not start within 5 minutes; admin account not ensured" >&2; return 1; }
    sleep 2
  done
  if "$CTL" check_account admin "$host" >/dev/null 2>&1; then
    "$CTL" change_password admin "$host" "$pass" >/dev/null 2>&1 \
      && echo "[xmpp] admin@$host present (password ensured)" \
      || echo "[xmpp] WARN: could not set the password of admin@$host" >&2
  else
    "$CTL" register admin "$host" "$pass" >/dev/null 2>&1 \
      && echo "[xmpp] admin@$host created" \
      || echo "[xmpp] WARN: could not register admin@$host" >&2
  fi
  : > /tmp/ethora-admin-ready
}
rm -f /tmp/ethora-admin-ready
ensure_admin &

exec /entrypoint.sh "$@"
'''

[[config.mounts]]
filePath = "/scripts/frontend-start.sh"
content = '''
#!/bin/sh
# frontend-start.sh - entrypoint of the frontend service in the compose bundle.
#
# The ethora-frontend image renders /config.js and the CSP from the VITE_*
# variables in its environment. Export the frontend.env the config service
# rendered (plain KEY=value lines, taken literally, the same as the docker
# --env-file that deploy/scripts/frontend-from-image.sh produces), then run
# the image's own entrypoint.
set -eu

ENV_FILE="${ETHORA_FRONTEND_ENV_FILE:-/ethora/config/frontend/frontend.env}"
[ -r "$ENV_FILE" ] || { echo "[frontend] $ENV_FILE missing; the config service did not run" >&2; exit 1; }

while IFS= read -r line || [ -n "$line" ]; do
  case "$line" in
    *'{{'*) continue ;;
    [A-Za-z_]*=*)
      key="${line%%=*}"
      case "$key" in *[!A-Za-z0-9_]*) continue ;; esac
      export "$line"
      ;;
  esac
done < "$ENV_FILE"

# One-origin installs (PUBLIC_URL) carry __ETHORA_ORIGIN__ / __ETHORA_ORIGIN_WS__
# in their URLs: after the image renders the bundle, a resolver is appended to
# config.js that replaces them with the page's own origin, so the app works
# under whatever address it was opened by.
render_bundle() { # render_bundle <html dir>
  /usr/local/bin/ethora-frontend render "$1"
  env | grep -q '^VITE_[A-Z_]*=.*__ETHORA_ORIGIN' || return 0
  cat >> "$1/config.js" <<'JS'
// compose bundle, one-origin install: URLs follow the address in the browser.
(function (c, l) {
  var o = l.origin, w = o.replace(/^http/, "ws");
  for (var k in c) {
    if (typeof c[k] === "string") {
      c[k] = c[k].split("__ETHORA_ORIGIN_WS__").join(w).split("__ETHORA_ORIGIN__").join(o);
    }
  }
})(window.__ETHORA_CONFIG__ = window.__ETHORA_CONFIG__ || {}, window.location);
JS
}

case "${1:-serve}" in
  # `render <dir>`: render a copy of the bundle and exit (hosts that serve
  # the files themselves, e.g. the Cloudron package).
  render)
    render_bundle "${2:?render needs a directory}"
    exit 0
    ;;
  serve)
    if env | grep -q '^VITE_[A-Z_]*=.*__ETHORA_ORIGIN'; then
      render_bundle "${HTML_DIR:-/usr/share/nginx/html}"
      exec nginx -g 'daemon off;'
    fi
    ;;
esac

exec /usr/local/bin/ethora-frontend "$@"
'''

