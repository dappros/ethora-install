# Ethora Core, Dokploy template (github.com/Dokploy/templates format).
# GENERATED FILE: edit template.in.toml and run build-template.sh; the mounts
# are the bundle's deploy/compose/scripts and deploy/compose/templates.
#
# No input is required: root_domain is a Dokploy-generated
# <name>-<hash>-<ip>.sslip.io host, the five public hosts api., app., xmpp.,
# files. and secure-files.<root_domain> are the domains below, and every
# secret is generated. To use your own domain change ROOT_DOMAIN and the
# seven domains together. Before the first deploy set ADMIN_EMAIL (the admin
# login), enable HTTPS with Let's Encrypt on the seven domains (the web app
# only works over https)
# and turn Isolated Deployment on (Advanced), so the service names stay
# private to this stack. See README.md.

[variables]
root_domain = "${domain}"
admin_password = "${password:20}"
jwt_secret = "${password:64}"
refresh_secret = "${password:64}"
xmpp_secret = "${password:32}"
xmpp_jwt_secret = "${password:64}"
xmpp_admin_password = "${password:24}"
internal_requests_secret = "${password:32}"
mysql_root_password = "${password:32}"
minio_root_user = "ethora${password:12}"
minio_root_password = "${password:32}"
centrifugo_api_key = "${password:64}"
centrifugo_hmac_secret = "${password:64}"
centrifugo_admin_password = "${password:24}"
centrifugo_admin_secret = "${password:64}"
ai_service_secret = "${password:32}"
docs_parse_secret = "${password:32}"
ai_postgres_password = "${password:32}"
b2b_push_secret = "${password:32}"
uptime_postgres_password = "${password:32}"
uptime_auth_password = "${password:24}"
# At-rest encryption: a passphrase for wallet keys, and "<64 hex>:<32 hex>" AES key and IV pairs.
cryptopair_secret = "${password:48}"
secret_for_db_encryption = "${hash:64}:${hash:32}"
secret_for_files_encryption = "${hash:64}:${hash:32}"

[config]
# The keys of the bundle's .env.example (deploy/compose/.env.example in
# github.com/dappros/ethora-install), same order, without the per-host
# overrides (API_DOMAIN, WIDGET_DOMAIN, ...) and the bundled proxy's settings
# (the Enterprise modules, COMPOSE_PROFILES=ai,push,..., need their hosts
# routed by Traefik like the five below: widget.<root> to widget:8080,
# playground.<root> to playground:3020, mcp.<root> to mcp:3030, uptime.<root>
# to uptime:8099 behind a basic-auth middleware, and api.<root>/push/ to
# push:8098 with the prefix stripped). ADMIN_EMAIL
# is the admin login; ADMIN_PASSWORD its initial password. MYSQL_ROOT_PASSWORD
# and MINIO_ROOT_* are written into the databases on the first start and must
# not change after it.
env = [
  "ROOT_DOMAIN=${root_domain}",
  "ADMIN_EMAIL=admin@${root_domain}",
  "ADMIN_PASSWORD=${admin_password}",
  "BASE_APP_DISPLAY_NAME=Ethora",
  "ETHORA_LICENSE_KEY=",
  "ETHORA_LICENSE_CALL_HOME=true",
  "ETHORA_LICENSE_SERVER_URL=",
  "JWT_SECRET=${jwt_secret}",
  "REFRESH_SECRET=${refresh_secret}",
  "XMPP_SECRET=${xmpp_secret}",
  "XMPP_JWT_SECRET=${xmpp_jwt_secret}",
  "CRYPTOPAIR_SECRET=${cryptopair_secret}",
  "SECRET_FOR_DB_ENCRYPTION=${secret_for_db_encryption}",
  "SECRET_FOR_FILES_ENCRYPTION=${secret_for_files_encryption}",
  "XMPP_ADMIN_PASSWORD=${xmpp_admin_password}",
  "INTERNAL_REQUESTS_SECRET=${internal_requests_secret}",
  "MYSQL_ROOT_PASSWORD=${mysql_root_password}",
  "MINIO_ROOT_USER=${minio_root_user}",
  "MINIO_ROOT_PASSWORD=${minio_root_password}",
  "CENTRIFUGO_API_KEY=${centrifugo_api_key}",
  "CENTRIFUGO_HMAC_SECRET=${centrifugo_hmac_secret}",
  "CENTRIFUGO_ADMIN_PASSWORD=${centrifugo_admin_password}",
  "CENTRIFUGO_ADMIN_SECRET=${centrifugo_admin_secret}",
  "AI_SERVICE_SECRET=${ai_service_secret}",
  "DOCS_PARSE_SECRET=${docs_parse_secret}",
  "AI_POSTGRES_PASSWORD=${ai_postgres_password}",
  "B2B_PUSH_SECRET=${b2b_push_secret}",
  "UPTIME_POSTGRES_PASSWORD=${uptime_postgres_password}",
  "UPTIME_AUTH_PASSWORD=${uptime_auth_password}",
  "AI_API_URL=https://api.openai.com/v1",
  "AI_API_KEY=",
  "AI_CHAT_MODEL=gpt-5.6-luna",
  "AI_EMBEDDING_MODEL=text-embedding-3-small",
  "AI_PG_URL=",
  "WIDGET_SCRIPT_VERSION=",
  "PUSH_PLATFORM_PROJECT_ID=",
  "PUSH_GATEWAY_URL=",
  "PUSH_GATEWAY_TOKEN=",
  "MCP_ENABLE_DANGEROUS_TOOLS=true",
  "UPTIME_AUTH_USER=admin",
  "ETHORA_API_IMAGE=docker.io/dappros/ethora-api:2610",
  "ETHORA_FRONTEND_IMAGE=docker.io/dappros/ethora-frontend:2610",
  "ETHORA_XMPP_IMAGE=docker.io/dappros/ethora-xmpp:2610",
  "ETHORA_AI_IMAGE=docker.io/dappros/ethora-ai:2610",
  "ETHORA_PUSH_IMAGE=docker.io/dappros/ethora-push:2610",
  "ETHORA_PLAYGROUND_IMAGE=docker.io/dappros/ethora-playground:2610",
  "ETHORA_MCP_IMAGE=docker.io/dappros/ethora-mcp:2610",
  "ETHORA_UPTIME_IMAGE=docker.io/dappros/ethora-uptime:2610",
  "COMPOSE_PROFILES=",
]

# api.<root>: the HTTP API (Swagger at /api-docs/).
[[config.domains]]
serviceName = "api"
port = 8080
host = "api.${root_domain}"

# app.<root>: web chat and admin panel ...
[[config.domains]]
serviceName = "frontend"
port = 8080
host = "app.${root_domain}"

# ... and, on the same host, the real-time channel (longer path rule wins).
[[config.domains]]
serviceName = "centrifugo"
port = 8000
host = "app.${root_domain}"
path = "/connection/websocket"

# xmpp.<root>: only /ws and /bosh; ejabberd's /api and /admin stay internal.
[[config.domains]]
serviceName = "xmpp"
port = 5280
host = "xmpp.${root_domain}"
path = "/ws"

[[config.domains]]
serviceName = "xmpp"
port = 5280
host = "xmpp.${root_domain}"
path = "/bosh"

# files.<root>: file storage (MinIO).
[[config.domains]]
serviceName = "minio"
port = 9000
host = "files.${root_domain}"

[[config.domains]]
serviceName = "api"
port = 8080
host = "secure-files.${root_domain}"

# The bundle's scripts and templates, mounted from ../files/ by docker-compose.yml.
[[config.mounts]]
filePath = "/scripts/api-entrypoint.sh"
content = '''
#!/bin/bash
# api-entrypoint.sh - entrypoint for every container of the ethora-api image
# in the compose bundle (api, jobs, init).
#
# Loads the backend.env the config service rendered, parsed by the dotenv
# package the API itself uses (so quoting and escaping behave exactly as on a
# host install), without overriding anything already in the environment.
# Then hands over to the image's own start.js:
#
#   api-entrypoint.sh api | jobs | bc-worker | script <path> [args...]
#   api-entrypoint.sh init            first-boot steps (scripts/init.sh)
#   api-entrypoint.sh verify          end-to-end check (scripts/verify.js)
set -euo pipefail

HERE="$(cd "$(dirname "$0")" && pwd)"
ENV_FILE="${ETHORA_BACKEND_ENV_FILE:-/ethora/config/api/backend.env}"
[ -r "$ENV_FILE" ] || { echo "[api] $ENV_FILE is missing or unreadable; the config service did not run" >&2; exit 1; }

exports="$(node -e '
  const fs = require("fs")
  const parsed = require("/app/node_modules/dotenv").parse(fs.readFileSync(process.argv[1]))
  const q = v => "\x27" + String(v).replace(/\x27/g, "\x27\\\x27\x27") + "\x27"
  for (const [k, v] of Object.entries(parsed)) {
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(k)) continue
    // dotenv.config() semantics: the process environment wins, and an empty
    // value never masks one baked into the image (ETHORA_BUILD_* etc.).
    if (process.env[k] !== undefined && (v === "" || process.env[k] !== "")) continue
    process.stdout.write("export " + k + "=" + q(v) + "\n")
  }
' "$ENV_FILE")"
eval "$exports"

if [ "${1:-}" = "init" ]; then
  shift
  exec bash "$HERE/init.sh" "$@"
fi
if [ "${1:-}" = "verify" ]; then
  shift
  exec node "$HERE/verify.js" "$@"
fi
exec node /app/dist/start.js "$@"
'''

[[config.mounts]]
filePath = "/scripts/init.sh"
content = '''
#!/bin/bash
# init.sh - the `init` service of the compose bundle: the first-boot steps
# the host installer runs in deploy/scripts/init-services.sh and
# run-migrations.sh, through the API image's script mode.
#
# Runs on every `docker compose up` after the API is healthy, and every step
# is idempotent, so a second run changes nothing:
#   1. base app + platform admin        scripts/initEthoraApp.js (exits 0 when present)
#   2. ejabberd accounts of the base    scripts/deploy/xmpp-app-lookup.js, then
#      app owner and system account     register / change_password over ejabberd's HTTP API
#   3. data migrations                  scripts/migrateSourceAgentId.js (re-runnable by design)
#   4. translation server languages     src/utils/scripts/syncTranslateLanguages.js
#
# The environment is backend.env, loaded by api-entrypoint.sh. The ejabberd
# admin account itself is created by the xmpp container (xmpp-start.sh).
set -uo pipefail

log()  { echo "[init] $*"; }
warn() { echo "[init] WARN: $*" >&2; }
die()  { echo "[init] ERROR: $*" >&2; exit 1; }

script() { NODE_NO_WARNINGS=1 NODE_OPTIONS="--no-deprecation" node /app/dist/start.js script "$@"; }

: "${MONGO_URI:?MONGO_URI missing from backend.env}"
: "${XMPP_HOST:?XMPP_HOST missing from backend.env}"
: "${XMPP_PASS:?XMPP_PASS missing from backend.env}"
XMPP_API="${XMPP_PATH:-http://xmpp:5280/api}"
API_URL="${API_INTERNAL_URL:-http://api:8080}"

# initEthoraApp.js reads these names (init-services.sh exports the same).
export PLATFORM_ACCOUNT_EMAIL="${PLATFORM_ACCOUNT_EMAIL:?}"
export BASE_APP_OWNER_EMAIL="${BASE_APP_OWNER_EMAIL:-$PLATFORM_ACCOUNT_EMAIL}"
export BASE_APP_OWNER_PASSWORD="${BASE_APP_OWNER_PASSWORD:-$PLATFORM_ACCOUNT_PASSWORD}"
export JWT_SECRET="${SECRET_KEY:-}"

# ----------------------------------------------------------- 1. base app --
# The API seeds the same base app on its own start (config/init.js), so the
# two can race on a slow host: initEthoraApp.js finds no app, the API inserts
# it, and the script's insert then fails on the unique domainName. A second
# attempt takes the "already exists" path, so retry a few times.
log "base app '${BASE_APP_DOMAIN_NAME:-}' and platform admin ${PLATFORM_ACCOUNT_EMAIL}"
attempt=1
until script scripts/initEthoraApp.js; do
  rc=$?
  [ $attempt -lt 4 ] || die "initEthoraApp.js failed (exit $rc) after $attempt attempts"
  log "initEthoraApp.js failed (exit $rc); retrying in 5 s (attempt $((attempt + 1)) of 4)"
  attempt=$((attempt + 1)); sleep 5
done

# ------------------------------------------------------ 2. xmpp accounts --
# ejabberd's HTTP API, authenticated as admin@<xmpp host> (the account the
# xmpp container registers on start and the backend uses the same way).
xmpp_api() { # xmpp_api <command> <json>
  curl -sS --max-time 10 -u "admin@${XMPP_HOST}:${XMPP_PASS}" \
    -H 'Content-Type: application/json' -X POST -d "$2" "$XMPP_API/$1"
}
json_str() { node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$1"; }

ensure_xmpp_account() { # ensure_xmpp_account <localpart or jid> <password> <label>
  local user="${1%%@*}" pass="$2" label="$3" u p h out
  [ -n "$user" ] && [ -n "$pass" ] || { warn "no XMPP credentials for the $label; skipped"; return 0; }
  u="$(json_str "$user")"; p="$(json_str "$pass")"; h="$(json_str "$XMPP_HOST")"
  out="$(xmpp_api check_account "{\"user\":$u,\"host\":$h}")"
  if [ "$out" = "0" ]; then
    out="$(xmpp_api change_password "{\"user\":$u,\"host\":$h,\"newpass\":$p}")"
    [ "$out" = "0" ] && { log "xmpp account of the $label present (password ensured)"; return 0; }
  else
    out="$(xmpp_api register "{\"user\":$u,\"host\":$h,\"password\":$p}")"
    case "$out" in *successfully*|*registered*) log "xmpp account of the $label created"; return 0 ;; esac
  fi
  warn "xmpp account of the $label: unexpected answer from ejabberd: $(printf '%s' "$out" | head -c 200)"
  return 1
}

# The admin account can lag the xmpp healthcheck by a few seconds.
for i in $(seq 1 60); do
  [ "$(xmpp_api check_account "{\"user\":\"admin\",\"host\":$(json_str "$XMPP_HOST")}" 2>/dev/null)" = "0" ] && break
  [ "$i" = 60 ] && die "ejabberd HTTP API at $XMPP_API does not accept admin@$XMPP_HOST (see: docker compose logs xmpp)"
  sleep 2
done

lookup_err="$(mktemp)"
lookup="$(script scripts/deploy/xmpp-app-lookup.js "$MONGO_URI" "${BASE_APP_DOMAIN_NAME:-}" "$PLATFORM_ACCOUNT_EMAIL" 2>"$lookup_err")" \
  || die "xmpp-app-lookup.js failed: $(tail -n 5 "$lookup_err")"
rm -f "$lookup_err"
field() { printf '%s\n' "$lookup" | sed -n "s/^ETHORA_XMPP_$1_B64=//p" | head -n 1 | base64 -d 2>/dev/null; }
rc=0
ensure_xmpp_account "$(field OWNER_USERNAME)" "$(field OWNER_PASSWORD)" "base app owner" || rc=1
ensure_xmpp_account "$(field SYSTEM_JID)" "$(field SYSTEM_PASSWORD)" "base app system account" || rc=1
[ "$rc" = 0 ] || die "could not provision the base app's xmpp accounts"

# ---------------------------------------------------------- 3. migrations --
# run-migrations.sh's list. Each one is idempotent and re-runnable, so no
# stamp files are kept.
for m in scripts/migrateSourceAgentId.js; do
  log "migration $m"
  script "$m" 2>&1 | sed 's/^/[init]   /' || warn "migration $m failed (non-fatal)"
done

# ---------------------------------------------------- 4. translate languages --
if out="$(script src/utils/scripts/syncTranslateLanguages.js "${TRANSLATE_LANGUAGES:-}" 2>&1)"; then
  log "translate languages: $(printf '%s' "$out" | tail -n 1)"
else
  warn "translate language sync failed (non-fatal): $(printf '%s' "$out" | tr '\n' ' ' | head -c 240)"
fi

# ------------------------------------------ 5. base app credentials --
# The playground and uptime modules drive the API as the base app (B2B):
# leave its id and secret in the config volume for module-start.sh. Mongo
# through the API image's own models (bytecode builds included).
creds_dir="${ETHORA_CONFIG_DIR:-/ethora/config}/base-app"
if mkdir -p "$creds_dir" 2>/dev/null && [ -w "$creds_dir" ]; then
  if out="$(NODE_NO_WARNINGS=1 node -e '
    try { require("/app/node_modules/bytenode") } catch (_) {}
    const mongoose = require("/app/node_modules/mongoose")
    const App = require("/app/dist/src/models/apps")
    mongoose.connect(process.argv[1]).then(async () => {
      const app = await App.findOne({ domainName: process.argv[2] }).lean()
      if (!app) throw new Error("base app not found")
      const b64 = (v) => Buffer.from(String(v || ""), "utf8").toString("base64")
      process.stdout.write(`ID=${b64(app._id)}\nSECRET=${b64(app.tenantSecret || app.appSecret || "")}\n`)
      await mongoose.disconnect()
    }).catch((e) => { console.error(e.message); process.exit(1) })
  ' "$MONGO_URI" "${BASE_APP_DOMAIN_NAME:-}" 2>&1)"; then
    app_id="$(printf '%s\n' "$out" | sed -n 's/^ID=//p' | base64 -d)"
    app_secret="$(printf '%s\n' "$out" | sed -n 's/^SECRET=//p' | base64 -d)"
    if [ -n "$app_id" ] && [ -n "$app_secret" ]; then
      umask 077
      printf 'ETHORA_CHAT_APP_ID=%s\nETHORA_CHAT_APP_SECRET=%s\n' "$app_id" "$app_secret" > "$creds_dir/credentials.env.tmp" \
        && mv "$creds_dir/credentials.env.tmp" "$creds_dir/credentials.env" && log "base app credentials written for the playground and uptime modules"
    else
      warn "base app credentials incomplete (non-fatal): $(printf '%s' "$out" | head -c 200)"
    fi
  else
    warn "base app credentials lookup failed (non-fatal): $(printf '%s' "$out" | tail -n 2 | tr '\n' ' ')"
  fi
else
  log "config volume not writable here; base app credentials for the modules skipped"
fi

# ----------------------------------------------------------------- done --
if curl -fsS --max-time 5 "$API_URL/v1/apps/get-config?domainName=${BASE_APP_DOMAIN_NAME:-}" >/dev/null 2>&1; then
  log "base app config served by the API"
else
  warn "GET /v1/apps/get-config?domainName=${BASE_APP_DOMAIN_NAME:-} did not answer yet"
fi
log "done. Web app: ${DEFAULT_APP_URL:-https://app.<root>}  admin: ${PLATFORM_ACCOUNT_EMAIL}"
'''

[[config.mounts]]
filePath = "/scripts/verify.js"
content = '''
// verify.js - end-to-end check of a running compose bundle, through the
// public URLs (the same path a browser or SDK takes):
//
//   docker compose --profile verify run --rm verify
//
// 1. https://app., https://api./api-docs/, https://files. answer 200 with a
//    certificate Node trusts (the system CA store; no --insecure).
// 2. The platform admin logs in (PLATFORM_ACCOUNT_EMAIL / _PASSWORD from
//    backend.env, or VERIFY_EMAIL / VERIFY_PASSWORD) and the licence state
//    is read.
// 3. A chat room is created, joined over wss://xmpp.<root>/ws with the
//    login's XMPP JWT, and a message sent to it comes back from the room.
// 4. A file is uploaded and read back through https://files.<root>, then
//    deleted.
// 5. A chat attachment is uploaded to the room (POST /v2/files/secure) and
//    read back from https://secure-files.<root> with the login's fileToken;
//    the same URL without a token is refused. On an install without the
//    secure files host (one origin) the route must answer 503, which the
//    web client treats as "use the public bucket".
// 6. With the ai module on (AI_SERVICE_ENABLED=true in backend.env): the
//    widget script is served from its public URL with this install's API
//    URL in it, ai-service and docs-parse answer on the compose network,
//    and the licence carries the ai feature.
// 7. The other modules, each when on (PUSH_ENABLED, PLAYGROUND_ENABLED,
//    MCP_ENABLED, UPTIME_ENABLED in backend.env): the push service answers
//    internally and at api.<root>/push/, the playground page loads, the MCP
//    server's health and the API's OAuth metadata answer, the uptime
//    dashboard refuses without credentials and answers with them.
//
// Exits non-zero on the first failure. The room it creates is left in place
// (named "verify <timestamp>").
const { client, xml } = require('/app/node_modules/@xmpp/client')

const env = process.env
const hostOf = (url, fallback) => { try { return new URL(url).host } catch { return fallback } }
// Public entry points as the config service rendered them (ETHORA_PUBLIC_*
// in backend.env): four https hosts, or one origin (PUBLIC_URL). VERIFY_*
// overrides them, e.g. to reach a LAN install by IP from this container.
const origin = (u) => String(u || '').replace(/\/+$/, '')
const WEB_URL = origin(env.VERIFY_WEB_URL || env.ETHORA_PUBLIC_WEB_URL)
const API_URL = origin(env.VERIFY_API_URL || env.ETHORA_PUBLIC_API_URL)
const FILES_URL = origin(env.VERIFY_FILES_URL || env.ETHORA_PUBLIC_FILES_URL)
const SECURE_FILES_URL = origin(env.VERIFY_SECURE_FILES_URL || env.ETHORA_PUBLIC_SECURE_FILES_URL)
const XMPP_WS = env.VERIFY_XMPP_WS_URL || env.ETHORA_PUBLIC_XMPP_WS_URL
const WIDGET_URL = env.VERIFY_WIDGET_URL || env.ETHORA_PUBLIC_WIDGET_URL || ''
const AI_MODULE = String(env.AI_SERVICE_ENABLED) === 'true'
const on = (k) => String(env[k]) === 'true'
const MODULES = { push: on('PUSH_ENABLED'), playground: on('PLAYGROUND_ENABLED'), mcp: on('MCP_ENABLED'), uptime: on('UPTIME_ENABLED') }
const WEB = hostOf(WEB_URL, '')
const API = hostOf(API_URL, '')
const FILES = hostOf(FILES_URL, '')
const SECURE_FILES = hostOf(SECURE_FILES_URL, '')
const XMPP = env.XMPP_HOST
const ONE_ORIGIN = WEB_URL === API_URL
const EMAIL = env.VERIFY_EMAIL || env.PLATFORM_ACCOUNT_EMAIL
const PASSWORD = env.VERIFY_PASSWORD || env.PLATFORM_ACCOUNT_PASSWORD
const SLUG = env.BASE_APP_DOMAIN_NAME
// VERIFY_SKIP=web skips the web page check, for a web UI behind a platform
// login (Umbrel's app_proxy); the other checks use the API and XMPP paths.
const SKIP = new Set(String(env.VERIFY_SKIP || '').split(',').map((x) => x.trim()).filter(Boolean))

let failures = 0
const ok = (msg) => console.log(`  ok    ${msg}`)
const fail = (msg) => { failures++; console.log(`  FAIL  ${msg}`) }
const die = (msg) => { fail(msg); summary(); }
function summary() {
  console.log(failures ? `\n${failures} check(s) failed` : '\nall checks passed')
  process.exit(failures ? 1 : 0)
}

async function http(url, opts = {}) {
  const res = await fetch(url, { redirect: 'manual', ...opts })
  const text = await res.text()
  let json = null
  try { json = JSON.parse(text) } catch { /* not JSON */ }
  return { status: res.status, text, json, headers: res.headers }
}

async function expect200(label, url) {
  try {
    const r = await http(url)
    if (r.status === 200) ok(`${label} ${url}`)
    else fail(`${label} ${url} -> HTTP ${r.status}`)
  } catch (e) {
    fail(`${label} ${url} -> ${e.cause ? e.cause.code || e.cause.message : e.message}`)
  }
}

async function xmppRoundTrip({ username, token, roomJid }) {
  // Rooms accept a member under its registered nick, the XMPP localpart (as
  // the web client joins).
  const nick = username
  const body = `verify message ${new Date().toISOString()}`
  const xmpp = client({ service: XMPP_WS, domain: XMPP, username, password: token, resource: `verify-${Date.now()}` })
  xmpp.on('error', () => {})
  const waitFor = (what, match) => new Promise((resolve, reject) => {
    const t = setTimeout(() => { xmpp.removeListener('stanza', on); reject(new Error(`${what}: no answer within 20 s`)) }, 20000)
    function on(st) {
      const err = st.attrs.type === 'error' && st.attrs.from && st.attrs.from.startsWith(roomJid) && st.getChild('error')
      if (err) { clearTimeout(t); xmpp.removeListener('stanza', on); reject(new Error(`${what}: ${err.toString().slice(0, 300)}`)); return }
      if (match(st)) { clearTimeout(t); xmpp.removeListener('stanza', on); resolve(st) }
    }
    xmpp.on('stanza', on)
  })
  await xmpp.start()
  ok(`xmpp login over ${XMPP_WS} as ${nick}`)
  try {
    // Join, and wait for our own presence back (MUC status 110).
    const joined = waitFor(`join ${roomJid}`, (st) => st.is('presence') && st.attrs.from === `${roomJid}/${nick}`)
    await xmpp.send(xml('presence', { to: `${roomJid}/${nick}` }, xml('x', { xmlns: 'http://jabber.org/protocol/muc' }, xml('history', { maxstanzas: '0' }))))
    await joined
    const echoed = waitFor('message', (st) => st.is('message') && st.attrs.type === 'groupchat' && st.getChildText('body') === body)
    await xmpp.send(xml('message', { to: roomJid, type: 'groupchat', id: `verify-${Date.now()}` }, xml('body', {}, body)))
    await echoed
    ok(`joined ${roomJid}, sent a message and received it back`)
  } finally {
    await xmpp.stop().catch(() => {})
  }
}

async function main() {
  const mods = Object.keys(MODULES).filter((k) => MODULES[k])
  console.log(`Ethora Core compose bundle: verify (web=${WEB_URL} api=${API_URL} xmpp=${XMPP_WS} files=${FILES_URL} secure-files=${SECURE_FILES_URL || 'off'} ai=${AI_MODULE ? WIDGET_URL : 'off'}${mods.length ? ' modules=' + mods.join(',') : ''})\n`)
  if (!WEB_URL || !API_URL || !XMPP_WS || !FILES_URL || !XMPP || !EMAIL || !PASSWORD) die('could not derive the public URLs or admin credentials from backend.env')

  // 1. public endpoints and certificates
  if (!SKIP.has('web')) await expect200('web app', `${WEB_URL}/`)
  await expect200('API docs', `${API_URL}/api-docs/`)
  await expect200('API ping', `${API_URL}/v1/ping`)
  // One origin routes only /files/ to MinIO; the upload below covers it.
  if (!ONE_ORIGIN) await expect200('file storage', `${FILES_URL}/minio/health/live`)
  if (failures) summary()

  // 2. login + licence
  const cfg = await http(`${API_URL}/v1/apps/get-config?domainName=${encodeURIComponent(SLUG)}`)
  const appToken = cfg.json && cfg.json.result && cfg.json.result.appToken
  if (!appToken) die(`get-config for base app "${SLUG}" returned no appToken (HTTP ${cfg.status})`)
  const login = await http(`${API_URL}/v2/users/login-with-email`, {
    method: 'POST',
    headers: { Authorization: appToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: EMAIL, password: PASSWORD }),
  })
  if (login.status !== 200 || !login.json || !login.json.token) die(`admin login as ${EMAIL} -> HTTP ${login.status} ${login.text.slice(0, 200)}`)
  // user.xmppPassword in a login response is the short-lived XMPP JWT
  // (helpers/sanitizeUser.ts), the password the web client signs in with.
  const { token, user } = login.json
  ok(`admin login as ${EMAIL}`)
  const auth = { Authorization: token }

  const lic = await http(`${API_URL}/v2/license`, { headers: auth })
  const l = lic.json && lic.json.license
  if (lic.status === 200 && l) {
    const desc = [l.edition, l.tier, l.state, l.registered === false ? 'unregistered' : l.registered ? 'registered' : ''].filter(Boolean).join(', ')
    ok(`licence: ${desc || JSON.stringify(l).slice(0, 160)}`)
    if (AI_MODULE) {
      const features = Array.isArray(l.features) ? l.features : []
      if (features.includes('*') || features.includes('ai')) ok('licence carries the ai feature')
      else fail(`ai module on, but the licence has no ai feature (features: ${features.join(',') || 'none'}); agents will be refused`)
    }
  } else fail(`GET /v2/license -> HTTP ${lic.status}`)

  // 3. chat room + message over XMPP
  const created = await http(`${API_URL}/v2/chats`, {
    method: 'POST',
    headers: { ...auth, 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: `verify ${new Date().toISOString()}`, description: 'created by the compose bundle verify check', type: 'public' }),
  })
  const room = created.json && (created.json.result || created.json)
  const localpart = room && (room.name || room.roomJid || room.jid || room.chatId)
  if (!(created.status === 200 || created.status === 201) || !localpart) die(`create chat room -> HTTP ${created.status} ${created.text.slice(0, 200)}`)
  const roomJid = String(localpart).includes('@') ? String(localpart) : `${localpart}@conference.${XMPP}`
  ok(`chat room created: ${roomJid}`)
  try {
    await xmppRoundTrip({ username: user.xmppUsername, token: user.xmppPassword, roomJid })
  } catch (e) {
    fail(`xmpp: ${e.message}`)
  }

  // 4. file upload through files.<root>
  const payload = `verify ${Date.now()}\n`
  const form = new FormData()
  form.append('files', new Blob([payload], { type: 'text/plain' }), 'verify.txt')
  const up = await http(`${API_URL}/v2/files`, { method: 'POST', headers: auth, body: form })
  const file = up.json && ((up.json.results && up.json.results[0]) || (up.json.result && up.json.result[0]) || up.json.result)
  const location = file && (file.location || file.url)
  if (up.status !== 200 && up.status !== 201) fail(`file upload -> HTTP ${up.status} ${up.text.slice(0, 200)}`)
  else if (!location) fail(`file upload returned no location: ${up.text.slice(0, 200)}`)
  else {
    const host = hostOf(location, '')
    const got = await http(location).catch((e) => ({ status: 0, text: e.message }))
    if (host !== FILES) fail(`uploaded file is served from ${host}, expected ${FILES}`)
    else if (got.status === 200 && got.text === payload) ok(`file uploaded and read back from ${location}`)
    else fail(`uploaded file at ${location} -> HTTP ${got.status}`)
    if (file._id) await http(`${API_URL}/v2/files/${file._id}`, { method: 'DELETE', headers: auth }).catch(() => {})
  }

  // 5. chat attachment through secure-files.<root>
  const secureForm = new FormData()
  secureForm.append('files', new Blob([payload], { type: 'text/plain' }), 'verify-attachment.txt')
  secureForm.append('chatName', String(localpart).split('@')[0])
  const sup = await http(`${API_URL}/v2/files/secure`, { method: 'POST', headers: auth, body: secureForm })
  if (!SECURE_FILES) {
    if (sup.status === 503) ok('secure files off: /v2/files/secure answers 503 (attachments use the public bucket)')
    else fail(`secure files off, but /v2/files/secure -> HTTP ${sup.status} ${sup.text.slice(0, 160)} (expected 503)`)
  } else {
    const sfile = sup.json && ((sup.json.results && sup.json.results[0]) || sup.json.result)
    const sloc = sfile && (sfile.location || sfile.url)
    if (sup.status !== 200 && sup.status !== 201) fail(`attachment upload -> HTTP ${sup.status} ${sup.text.slice(0, 200)}`)
    else if (!sloc) fail(`attachment upload returned no location: ${sup.text.slice(0, 200)}`)
    else if (hostOf(sloc, '') !== SECURE_FILES) fail(`attachment is served from ${hostOf(sloc, '')}, expected ${SECURE_FILES}`)
    else {
      const anon = await http(sloc).catch((e) => ({ status: 0, text: e.message }))
      if (anon.status === 401 || anon.status === 403) ok(`attachment without a token is refused (HTTP ${anon.status})`)
      else fail(`attachment without a token -> HTTP ${anon.status} (expected 401 or 403)`)
      const fileToken = login.json.fileToken || ''
      if (!fileToken) fail('login response carries no fileToken to fetch the attachment with')
      else {
        const signed = new URL(sloc); signed.searchParams.set('ft', fileToken)
        const got = await http(signed.toString()).catch((e) => ({ status: 0, text: e.message }))
        if (got.status === 200 && got.text === payload) ok(`attachment uploaded and read back from ${sloc} with the fileToken`)
        else fail(`attachment at ${sloc} with the fileToken -> HTTP ${got.status}`)
      }
      if (sfile._id) await http(`${API_URL}/v2/files/${sfile._id}`, { method: 'DELETE', headers: auth }).catch(() => {})
    }
  }

  // 6. ai module
  if (AI_MODULE) {
    if (!WIDGET_URL) fail('ai module on, but backend.env names no widget URL')
    else {
      const w = await http(WIDGET_URL).catch((e) => ({ status: 0, text: e.message }))
      if (w.status !== 200) fail(`widget script ${WIDGET_URL} -> HTTP ${w.status}`)
      else if (!w.text.includes(`${API_URL}/v1`)) fail(`widget script ${WIDGET_URL} does not carry this install's API URL ${API_URL}/v1`)
      else if (w.text.includes('__ETHORA_WIDGET_')) fail(`widget script ${WIDGET_URL} still has unrendered placeholders`)
      else ok(`widget script served from ${WIDGET_URL} for ${API_URL}`)
    }
    const ai = env.AI_SERVICE_INTERNAL_URL || env.AI_SERVICE_URL
    const dp = env.DOCS_PARSE_INTERNAL_URL || env.DOCS_PARSE_URL
    // ai-service authorises every route with the shared secret; a 401
    // without it already proves the server answers.
    const a = ai ? await http(`${ai}/bots`).catch((e) => ({ status: 0, text: e.message })) : { status: 0, text: 'no URL' }
    if (a.status > 0 && a.status < 500) ok(`ai-service answers at ${ai} (HTTP ${a.status} without the secret)`)
    else fail(`ai-service at ${ai || 'unset'} -> ${a.status ? `HTTP ${a.status}` : a.text}`)
    const d = dp ? await http(`${dp}/health`).catch((e) => ({ status: 0, text: e.message })) : { status: 0, text: 'no URL' }
    if (d.status === 200) ok(`docs-parse answers at ${dp}`)
    else fail(`docs-parse at ${dp || 'unset'} -> ${d.status ? `HTTP ${d.status}` : d.text}`)
  }

  // 7. push, playground, mcp, uptime
  const probe = (url, opts) => http(url, opts).catch((e) => ({ status: 0, text: e.cause ? e.cause.code || e.cause.message : e.message }))
  const show = (r) => (r.status ? `HTTP ${r.status}` : r.text)
  if (MODULES.push) {
    const p = await probe(`${env.PUSH_INTERNAL_URL || 'http://push:8098'}/health`)
    if (p.status === 200) ok(`push service answers at ${env.PUSH_INTERNAL_URL || 'http://push:8098'}`)
    else fail(`push service -> ${show(p)}`)
    const pub = await probe(`${API_URL}/push/health`)
    if (pub.status === 200) ok(`push service reachable for mobile apps at ${API_URL}/push/`)
    else fail(`${API_URL}/push/health -> ${show(pub)} (the proxy must route /push/ to the push service)`)
  }
  if (MODULES.playground) {
    const u = origin(env.ETHORA_PUBLIC_PLAYGROUND_URL)
    const r = u ? await probe(`${u}/`) : { status: 0, text: 'no URL' }
    if (r.status === 200) ok(`SDK playground answers at ${u}`)
    else fail(`SDK playground at ${u || 'unset'} -> ${show(r)} (its first start builds the app; try again in a few minutes)`)
  }
  if (MODULES.mcp) {
    const h = await probe(`${env.MCP_INTERNAL_URL || 'http://mcp:3030'}/healthz`)
    if (h.status === 200) ok(`MCP server answers at ${env.MCP_INTERNAL_URL || 'http://mcp:3030'}`)
    else fail(`MCP server -> ${show(h)}`)
    const pubUrl = String(env.ETHORA_PUBLIC_MCP_URL || '')
    const base = pubUrl.replace(/\/mcp$/, '')
    const m = base ? await probe(`${base}/healthz`) : { status: 0, text: 'no URL' }
    if (m.status === 200) ok(`MCP server reachable at ${pubUrl}`)
    else fail(`MCP server at ${base || 'unset'}/healthz -> ${show(m)}`)
    const oauth = await probe(`${API_URL}/.well-known/oauth-authorization-server`)
    if (oauth.status === 200 && oauth.json && oauth.json.issuer) ok(`OAuth authorization server on the API (issuer ${oauth.json.issuer})`)
    else fail(`${API_URL}/.well-known/oauth-authorization-server -> ${show(oauth)}`)
  }
  if (MODULES.uptime) {
    const u = origin(env.ETHORA_PUBLIC_UPTIME_URL)
    const anon = u ? await probe(`${u}/health`) : { status: 0, text: 'no URL' }
    if (anon.status === 401) ok(`uptime dashboard at ${u} asks for credentials`)
    else fail(`uptime dashboard at ${u || 'unset'} without credentials -> ${show(anon)} (expected 401)`)
    const cred = Buffer.from(`${env.UPTIME_AUTH_USER || 'admin'}:${env.UPTIME_AUTH_PASSWORD || ''}`).toString('base64')
    const authed = u ? await probe(`${u}/health`, { headers: { Authorization: `Basic ${cred}` } }) : { status: 0, text: 'no URL' }
    if (authed.status === 200) ok(`uptime dashboard answers with the configured credentials`)
    else fail(`uptime dashboard with credentials -> ${show(authed)}`)
  }

  summary()
}

main().catch((e) => die(e.stack || e.message))
'''

[[config.mounts]]
filePath = "/scripts/render-config.sh"
content = '''
#!/bin/sh
# render-config.sh - the `config` service of the compose bundle.
#
# Renders every config file the stack reads from the operator's settings
# (.env, or the variables a platform passes in), using the same templates
# the host installer renders (deploy/scripts/setup-env.sh,
# deploy/scripts/setup-ejabberd-config.sh):
#
#   /out/config/api/backend.env            <- templates/backend.env.template
#   /out/config/frontend/frontend.env      <- templates/frontend.env.template
#   /out/config/centrifugo/config.json     <- templates/centrifugo-config.json.template
#   /out/config/xmpp/ejabberd.yml, jwt.key <- /ethora-dist/ejabberd-prod.yml (from the xmpp image)
#   /out/config/caddy/Caddyfile            <- /ethora/Caddyfile
#   /out/config/mysql, /out/config/minio   <- the database credentials, as *_FILE secrets
#   /out/config/scripts/                   <- the bundle's scripts, which every other service runs
#   /out/mysql-initdb/01-ejabberd.sql      <- /ethora-dist/mysql2.sql (from the xmpp image)
# and, with the ai module (profile `ai` in COMPOSE_PROFILES, or AI_SERVICE_ENABLED=true):
#   /out/config/ai/ai-service.env          <- templates/ai-service.env.template
#   /out/config/ai/docs-parse.env          <- templates/docs-parse.env.template
#   /out/config/widget/widget.env          <- templates/widget.env.template
#   /out/config/widget/Caddyfile           the static server of the widget bundle
#   /out/config/ai-postgres/password       the bundled Postgres' password
# and likewise for the push, playground, mcp and uptime modules (profiles of the
# same names, or PUSH_ENABLED / PLAYGROUND_ENABLED / MCP_ENABLED / UPTIME_ENABLED):
#   /out/config/push/push.env              <- templates/push.env.template
#   /out/config/playground/playground.env  the SDK playground's public URLs
#   /out/config/mcp/mcp.env                <- templates/mcp.env.template
#   /out/config/uptime/uptime.env, uptime.yml, auth-password
#                                          <- templates/uptime.env.template, uptime-config.yml.template
#   /out/config/uptime-db/password         the uptime Postgres' password
# (init.sh adds /out/config/base-app/credentials.env, the base app's API
# credentials the playground and uptime modules sign in with.)
#
# It runs in the ethora-xmpp image (development form, scripts bind-mounted)
# or in the ethora-compose-init image, which is the xmpp image plus this
# directory (single-file form); either way the ejabberd template and schema
# come from the xmpp release that is about to run. It runs on every
# `docker compose up` and rewrites everything; the rendered files are
# disposable.
#
# Secrets: a secret given in the environment wins. One left empty is taken
# from /out/secrets/secrets.env (the `secrets` volume) or, on the first start,
# generated there, so a compose file with nothing but ROOT_DOMAIN and
# ADMIN_EMAIL is a complete install.
#
# Two routing modes, chosen by PUBLIC_URL:
#   unset  five hosts, api./app./xmpp./files./secure-files.<ROOT_DOMAIN>, TLS by Caddy
#          (the host installer's layout).
#   set    one origin, e.g. https://chat.example.com or http://nas.local:8420
#          (appliances: Umbrel, CasaOS): Caddy routes by path, and the web
#          app takes its API / XMPP / Centrifugo URLs from the address the
#          browser used.
#
# Internal endpoints default to the compose service names; the Helm chart and
# installs with external databases override them (all optional):
#   ETHORA_MONGO_URI, ETHORA_CHAT_DATABASE_URI   Mongo, app data and chat archive
#   ETHORA_AI_SERVICE_MONGO_URI                  Mongo, the ai-service db (stats email reads it)
#   ETHORA_REDIS_HOST, ETHORA_REDIS_PORT         Redis (no password: the API has none)
#   ETHORA_MYSQL_HOST, ETHORA_MYSQL_PORT, ETHORA_MYSQL_USER
#                                                ejabberd's SQL store; the password is
#                                                MYSQL_ROOT_PASSWORD whatever the user
#   ETHORA_MINIO_HOST, ETHORA_MINIO_PORT         S3-compatible storage over plain HTTP
#   ETHORA_MYSQL_DATABASE                        default ejabberd_db
#   ETHORA_CENTRIFUGO_URL, ETHORA_XMPP_URL, ETHORA_API_URL, ETHORA_FRONTEND_URL
#                                                http://centrifugo:8000, http://xmpp:5280,
#                                                http://api:8080, http://frontend:8080
#   ETHORA_AI_SERVICE_URL, ETHORA_DOCS_PARSE_URL, ETHORA_WIDGET_URL (ai module)
#                                                http://ai-service:8013, http://docs-parse:8201,
#                                                http://widget:8080
#   ETHORA_AI_POSTGRES_HOST, ETHORA_AI_POSTGRES_PORT   the bundled pgvector Postgres
#                                                (ai-postgres, 5432) unless AI_PG_URL is set
#   ETHORA_PUSH_URL, ETHORA_PLAYGROUND_URL, ETHORA_MCP_URL, ETHORA_UPTIME_URL
#                                                http://push:8098, http://playground:3020,
#                                                http://mcp:3030, http://uptime:8099
#   ETHORA_UPTIME_POSTGRES_HOST, ETHORA_UPTIME_POSTGRES_PORT   uptime-db, 5432
# and, for a host that is not compose (the Cloudron package):
#   ETHORA_SITE_ADDRESS    the one-origin site's Caddy address, e.g. :3000
#                          behind a proxy that terminates TLS itself
#   ETHORA_EXTRA_SITES     more Caddy site blocks, appended as they are
#   API_UID, XMPP_UID, CENTRIFUGO_UID, MYSQL_UID, MINIO_UID, FRONTEND_UID,
#   AI_UID, AI_POSTGRES_UID, MODULE_UID, UPTIME_POSTGRES_UID
#                          owners of the rendered files (the images' users)
#
# Differences from the host installer, all because the services talk over the
# compose network instead of the host's loopback:
#   - backend.env: MONGO_URI, CHAT_DATABASE, AI_SERVICE_MONGO_URI, REDIS_HOST, MINIO_HOST,
#     MAM_MYSQL_HOST, CENTRIFUGO_API_URL and XMPP_PATH point at the compose
#     service names (mongo, redis, minio, mysql, centrifugo, xmpp).
#   - ejabberd.yml: the tracking / audit URLs point at http://api:8080
#     instead of the public https://api.<root>, so ejabberd never hairpins
#     through the proxy.
#   - BUILD_* stay empty, so the version baked into each image is reported.
set -eu

TEMPLATES="${TEMPLATES_DIR:-/ethora/templates}"
CADDYFILE_TEMPLATE="${CADDYFILE_TEMPLATE:-/ethora/Caddyfile}"
SCRIPTS_SRC="$(cd "$(dirname "$0")" && pwd)"
DIST="${XMPP_DIST_DIR:-/ethora-dist}"
OUT="${CONFIG_OUT_DIR:-/out/config}"
SECRETS_DIR="${SECRETS_DIR:-/out/secrets}"
MYSQL_INITDB="${MYSQL_INITDB_DIR:-/out/mysql-initdb}"
# Numeric owners of the consumers (the stock images' users). Rendering as
# root, each file is handed to the one container user that reads it.
API_UID="${API_UID:-1000}"          # ethora-api: node
XMPP_UID="${XMPP_UID:-9000}"        # ethora-xmpp: ejabberd
CENTRIFUGO_UID="${CENTRIFUGO_UID:-1000}"
MYSQL_UID="${MYSQL_UID:-999}"       # mysql: mysql
MINIO_UID="${MINIO_UID:-0}"         # minio: root
FRONTEND_UID="${FRONTEND_UID:-0}"   # ethora-frontend: root
AI_UID="${AI_UID:-1000}"            # ethora-ai: node
AI_POSTGRES_UID="${AI_POSTGRES_UID:-999}"   # pgvector/pgvector: postgres
MODULE_UID="${MODULE_UID:-1000}"            # ethora-push, ethora-playground, ethora-mcp: node
UPTIME_POSTGRES_UID="${UPTIME_POSTGRES_UID:-70}"   # postgres:alpine: postgres

log() { echo "[config] $*"; }
die() { echo "[config] ERROR: $*" >&2; exit 1; }

# -------------------------------------------------------------- secrets --
SECRETS_FILE="$SECRETS_DIR/secrets.env"
store=""
if mkdir -p "$SECRETS_DIR" 2>/dev/null && touch "$SECRETS_FILE" 2>/dev/null; then
  chmod 700 "$SECRETS_DIR"; chmod 600 "$SECRETS_FILE"
  store=1
fi
rand() { case "$1" in keyiv) keyiv ;; yymm) date -u +%y%m ;; *) tr -dc 'A-Za-z0-9' < /dev/urandom 2>/dev/null | head -c "$1" ;; esac; }
# "<64 hex>:<32 hex>": AES-256-CBC key and IV for the API's at-rest encryption.
keyiv() { h="$(head -c 48 /dev/urandom | od -An -tx1 | tr -d ' \n')"; printf '%s:%s' "$(printf '%s' "$h" | cut -c1-64)" "$(printf '%s' "$h" | cut -c65-96)"; }
stored() { [ -n "$store" ] && sed -n "s/^$1=//p" "$SECRETS_FILE" | head -n 1; }
record() {
  awk -v k="$1" 'index($0, k "=") != 1' "$SECRETS_FILE" > "$SECRETS_FILE.tmp"
  printf '%s=%s\n' "$1" "$2" >> "$SECRETS_FILE.tmp"
  mv "$SECRETS_FILE.tmp" "$SECRETS_FILE"; chmod 600 "$SECRETS_FILE"
}
missing=""; generated=""
secret() { # secret NAME LENGTH [PREFIX]: environment > secrets volume > generated
  eval "cur=\${$1:-}"
  old="$(stored "$1" || true)"
  if [ -n "$cur" ]; then val="$cur"
  elif [ -n "$old" ]; then val="$old"
  elif [ -n "$store" ]; then val="${3:-}$(rand "$2")"; generated="$generated $1"
  else missing="$missing $1"; return 0
  fi
  export "$1=$val"
  if [ -n "$store" ] && [ "$val" != "$old" ]; then record "$1" "$val"; fi
}
secret ADMIN_PASSWORD 20
secret JWT_SECRET 64
secret REFRESH_SECRET 64
secret XMPP_JWT_SECRET 64
secret XMPP_SECRET 32
secret CRYPTOPAIR_SECRET 48
secret SECRET_FOR_DB_ENCRYPTION keyiv
secret SECRET_FOR_FILES_ENCRYPTION keyiv
secret XMPP_ADMIN_PASSWORD 24
secret INTERNAL_REQUESTS_SECRET 32
secret MYSQL_ROOT_PASSWORD 32
secret MINIO_ROOT_USER 12 ethora-
secret MINIO_ROOT_PASSWORD 32
secret CENTRIFUGO_API_KEY 64
secret CENTRIFUGO_HMAC_SECRET 64
secret CENTRIFUGO_ADMIN_PASSWORD 24
secret CENTRIFUGO_ADMIN_SECRET 64
# The ai module's (generated for every install, so switching it on later
# needs no new values). WIDGET_SCRIPT_VERSION is not secret, only persistent:
# the version suffix of the widget URL, fixed at the first start.
secret AI_SERVICE_SECRET 32
secret DOCS_PARSE_SECRET 32
secret AI_POSTGRES_PASSWORD 32
secret WIDGET_SCRIPT_VERSION yymm
secret B2B_PUSH_SECRET 32
secret UPTIME_POSTGRES_PASSWORD 32
secret UPTIME_AUTH_PASSWORD 24
[ -z "$missing" ] || die "missing:$missing (set them in .env, or mount the secrets volume at $SECRETS_DIR so they are generated)"
[ -z "$generated" ] || log "generated and stored in the secrets volume:$generated"
case " $generated " in
  *" ADMIN_PASSWORD "*) log "admin password (generated, shown once): $ADMIN_PASSWORD" ;;
esac

# ------------------------------------------------------ hosts and mode --
[ -n "${ADMIN_EMAIL:-}" ] || die "ADMIN_EMAIL is not set"
PUBLIC_URL="${PUBLIC_URL:-}"
if [ -n "$PUBLIC_URL" ]; then
  PUBLIC_URL="${PUBLIC_URL%/}"
  case "$PUBLIC_URL" in
    http://*|https://*) ;;
    *) die "PUBLIC_URL must start with http:// or https:// (got: $PUBLIC_URL)" ;;
  esac
  scheme="${PUBLIC_URL%%://*}"
  hostport="${PUBLIC_URL#*://}"
  case "$hostport" in */*) die "PUBLIC_URL must be an origin without a path (got: $PUBLIC_URL)" ;; esac
  host="${hostport%%:*}"
  [ -n "$host" ] || die "PUBLIC_URL has no host (got: $PUBLIC_URL)"
  ws_origin="ws${scheme#http}://$hostport"
  # One origin: every public host is that one, the XMPP domain included. The
  # web client (chat-component) takes the XMPP domain from the host of its
  # WebSocket URL, so the two must match, even when the host is an IP address.
  export ROOT_DOMAIN="${ROOT_DOMAIN:-$host}"
  export API_DOMAIN="$host" WEB_DOMAIN="$host" FILES_DOMAIN="$host" XMPP_DOMAIN="$host"
  # No fifth host on one origin: attachments use the public files bucket.
  export SECURE_FILES_DOMAIN=""
  export BASE_APP_DOMAIN_NAME="${BASE_APP_DOMAIN_NAME:-ethora}"
else
  [ -n "${ROOT_DOMAIN:-}" ] || die "ROOT_DOMAIN is not set (or set PUBLIC_URL for a one-origin install)"
  # Same derivations as setup.sh / refresh-deploy-env.sh / setup-env.sh.
  export API_DOMAIN="${API_DOMAIN:-api.$ROOT_DOMAIN}"
  export WEB_DOMAIN="${WEB_DOMAIN:-app.$ROOT_DOMAIN}"
  export XMPP_DOMAIN="${XMPP_DOMAIN:-xmpp.$ROOT_DOMAIN}"
  export FILES_DOMAIN="${FILES_DOMAIN:-files.$ROOT_DOMAIN}"
  # Chat attachments: their own host, served by the API and gated by chat
  # membership. Derived like the others; `off` leaves it empty (public bucket).
  case "$(printf '%s' "${SECURE_FILES_DOMAIN:-}" | tr 'A-Z' 'a-z')" in
    off|none|false|no) SECURE_FILES_DOMAIN="" ;;
    "") SECURE_FILES_DOMAIN="secure-files.$ROOT_DOMAIN" ;;
  esac
  export SECURE_FILES_DOMAIN
