# documentation: https://github.com/dappros/ethora-install/tree/main/deploy/compose
# slogan: Self-hosted chat and messaging server (API, web chat and admin panel, XMPP, file storage).
# category: communication
# tags: chat, messaging, xmpp, ejabberd, mongodb, sdk, self-hosted
# logo: svgs/ethora.svg
# port: 8080
#
# Ethora Core as a Coolify one-click service. GENERATED FILE: edit
# ethora-core.in.yaml and run build-template.sh; the scripts and templates
# below are the bundle's own (deploy/compose/scripts, deploy/compose/templates),
# carried as inline `content:` files because a one-click service has no git
# checkout to bind-mount them from. Same start order as docker-compose.yml:
# config -> databases -> xmpp -> api, jobs -> init -> frontend. No bundled
# proxy: Coolify's proxy routes the four public hosts (the SERVICE_FQDN_*
# variables of api, frontend, xmpp and minio).
#
# Inputs: ROOT_DOMAIN and ADMIN_EMAIL. Every secret is generated by Coolify.
# The four hosts are api., app., xmpp. and files.<ROOT_DOMAIN>: before the
# first deploy set the domains of api, frontend, xmpp (path /ws) and minio to
# exactly those, and give centrifugo the frontend host with the path
# /connection/websocket. See platforms/coolify/README.md.

x-file-api-entrypoint: &file-api-entrypoint
  type: bind
  source: ./scripts/api-entrypoint.sh
  target: /ethora/scripts/api-entrypoint.sh
  read_only: true
  @content scripts/api-entrypoint.sh
x-file-init: &file-init
  type: bind
  source: ./scripts/init.sh
  target: /ethora/scripts/init.sh
  read_only: true
  @content scripts/init.sh
x-file-verify: &file-verify
  type: bind
  source: ./scripts/verify.js
  target: /ethora/scripts/verify.js
  read_only: true
  @content scripts/verify.js
x-file-render-config: &file-render-config
  type: bind
  source: ./scripts/render-config.sh
  target: /ethora/scripts/render-config.sh
  read_only: true
  @content scripts/render-config.sh
x-file-mongo-init: &file-mongo-init
  type: bind
  source: ./scripts/mongo-init.sh
  target: /ethora/scripts/mongo-init.sh
  read_only: true
  @content scripts/mongo-init.sh
x-file-xmpp-start: &file-xmpp-start
  type: bind
  source: ./scripts/xmpp-start.sh
  target: /ethora/scripts/xmpp-start.sh
  read_only: true
  @content scripts/xmpp-start.sh
x-file-frontend-start: &file-frontend-start
  type: bind
  source: ./scripts/frontend-start.sh
  target: /ethora/scripts/frontend-start.sh
  read_only: true
  @content scripts/frontend-start.sh
x-file-backend-template: &file-backend-template
  type: bind
  source: ./templates/backend.env.template
  target: /ethora/templates/backend.env.template
  read_only: true
  @content templates/backend.env.template
x-file-frontend-template: &file-frontend-template
  type: bind
  source: ./templates/frontend.env.template
  target: /ethora/templates/frontend.env.template
  read_only: true
  @content templates/frontend.env.template
x-file-centrifugo-template: &file-centrifugo-template
  type: bind
  source: ./templates/centrifugo-config.json.template
  target: /ethora/templates/centrifugo-config.json.template
  read_only: true
  @content templates/centrifugo-config.json.template

x-config-volume: &config-volume
  type: volume
  source: config
  target: /ethora/config
  read_only: true

x-api-volumes: &api-volumes
  - *config-volume
  - *file-api-entrypoint
  - *file-init
  - *file-verify

services:
  config:
    image: docker.io/dappros/ethora-xmpp:2610
    user: "0:0"
    entrypoint: ["/bin/sh", "/ethora/scripts/render-config.sh"]
    # Every variable the renderer needs, so Coolify creates and generates them.
    environment:
      # The four hosts derive from ROOT_DOMAIN (api., app., xmpp., files.), as in
      # the bundle; Coolify's SERVICE_FQDN_* values are not used for them
      # because Coolify appends a route's path to them (xmpp.example.com/ws).
      # To use other hosts, add API_DOMAIN, WEB_DOMAIN, XMPP_DOMAIN and
      # FILES_DOMAIN to the service's environment variables.
      - ROOT_DOMAIN=${ROOT_DOMAIN:?}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      - BASE_APP_DISPLAY_NAME=${BASE_APP_DISPLAY_NAME:-Ethora}
      - ETHORA_LICENSE_KEY=${ETHORA_LICENSE_KEY:-}
      - ETHORA_LICENSE_CALL_HOME=${ETHORA_LICENSE_CALL_HOME:-true}
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - REFRESH_SECRET=${SERVICE_PASSWORD_64_REFRESH}
      - XMPP_SECRET=${SERVICE_PASSWORD_XMPP}
      - XMPP_JWT_SECRET=${SERVICE_PASSWORD_64_XMPPJWT}
      - XMPP_ADMIN_PASSWORD=${SERVICE_PASSWORD_XMPPADMIN}
      - INTERNAL_REQUESTS_SECRET=${SERVICE_PASSWORD_INTERNAL}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
      - CENTRIFUGO_API_KEY=${SERVICE_PASSWORD_64_CENTRIFUGOAPI}
      - CENTRIFUGO_HMAC_SECRET=${SERVICE_PASSWORD_64_CENTRIFUGOHMAC}
      - CENTRIFUGO_ADMIN_PASSWORD=${SERVICE_PASSWORD_CENTRIFUGOADMIN}
      - CENTRIFUGO_ADMIN_SECRET=${SERVICE_PASSWORD_64_CENTRIFUGOSECRET}
    volumes:
      - type: volume
        source: config
        target: /out/config
      - type: volume
        source: mysql-initdb
        target: /out/mysql-initdb
      - *file-render-config
      - *file-backend-template
      - *file-frontend-template
      - *file-centrifugo-template
    restart: "no"

  mongo:
    image: mongo:6.0.8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo:/data/db
      - mongo-config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 10s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:6.0.8
    entrypoint: ["bash", "/ethora/scripts/mongo-init.sh"]
    volumes:
      - *file-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  mysql:
    image: mysql:8.1.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      - MYSQL_ROOT_HOST=%
    volumes:
      - mysql:/var/lib/mysql
      - mysql-initdb:/docker-entrypoint-initdb.d:ro
    depends_on:
      config:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: docker.io/dappros/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      - SERVICE_FQDN_MINIO_9000
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    volumes:
      - minio:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: ["centrifugo", "-c", "/ethora/config/centrifugo/config.json"]
    environment:
      # Same host as frontend; only this path is routed here.
      - SERVICE_FQDN_CENTRIFUGO_8000=/connection/websocket
    volumes:
      - *config-volume
    depends_on:
      config:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xmpp:
    image: docker.io/dappros/ethora-xmpp:2610
    entrypoint: ["/bin/sh", "/ethora/scripts/xmpp-start.sh"]
    environment:
      # Web and SDK clients use wss://<host>/ws; /api and /admin stay internal.
      - SERVICE_FQDN_XMPP_5280=/ws
      # XMPP_DOMAIN is read from the rendered ejabberd.yml (xmpp-start.sh).
      - XMPP_ADMIN_PASSWORD=${SERVICE_PASSWORD_XMPPADMIN}
    volumes:
      - *config-volume
      - *file-xmpp-start
    depends_on:
      config:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ethora-admin-ready && /opt/ejabberd/bin/ejabberdctl status >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  api:
    image: docker.io/dappros/ethora-api:2610
    entrypoint: ["tini", "--", "bash", "/ethora/scripts/api-entrypoint.sh"]
    command: ["api"]
    environment:
      - SERVICE_FQDN_API_8080
    volumes: *api-volumes
    depends_on:
      config:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      xmpp:
        condition: service_started
    restart: unless-stopped

  jobs:
    image: docker.io/dappros/ethora-api:2610
    entrypoint: ["tini", "--", "bash", "/ethora/scripts/api-entrypoint.sh"]
    command: ["jobs"]
    volumes: *api-volumes
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  init:
    image: docker.io/dappros/ethora-api:2610
    entrypoint: ["tini", "--", "bash", "/ethora/scripts/api-entrypoint.sh"]
    command: ["init"]
    volumes: *api-volumes
    depends_on:
      api:
        condition: service_healthy
      xmpp:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  frontend:
    image: docker.io/dappros/ethora-frontend:2610
    entrypoint: ["/bin/sh", "/ethora/scripts/frontend-start.sh"]
    command: ["serve"]
    environment:
      - SERVICE_FQDN_FRONTEND_8080
    volumes:
      - *config-volume
      - *file-frontend-start
    depends_on:
      config:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mongo:
  mysql:
  minio:
  redis:
  mongo-config:
  config:
  mysql-initdb:
