# Ethora: response compression for the static assets nginx serves itself
# (admin panel bundles, the widget script, hosted apps) and for proxied
# responses that arrive uncompressed.
#
# Installed by setup-nginx.sh as /etc/nginx/conf.d/ethora-gzip.conf, http
# context. The distribution nginx.conf ships `gzip on;` with the type list
# commented out, which compresses text/html only: the 3.5 MB widget bundle and
# every admin-panel chunk went out uncompressed. API JSON was already fine
# because the API compresses its own responses (nginx leaves anything that
# carries Content-Encoding alone).
#
# setup-nginx.sh skips this file when the main nginx.conf already has an
# active gzip_types line, since nginx rejects the directive twice at one level.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/xml
    application/xml+rss
    image/svg+xml
    application/wasm
    font/ttf
    application/vnd.ms-fontobject;
# Serve a prebuilt .gz next to the file when the build produced one.
gzip_static on;
